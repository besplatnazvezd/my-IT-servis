<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG-STORE | 16 YEARS CEO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="font-sans min-h-screen">

    <nav class="flex justify-between items-center p-6 max-w-6xl mx-auto">
        <div class="text-2xl font-black bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent uppercase">TG-MILLIONAIRE</div>
        <div id="auth-section">
            <button onclick="showAuthModal()" class="glass px-6 py-2 rounded-full font-bold">ВОЙТИ</button>
        </div>
    </nav>

    <header class="text-center py-10 px-4">
        <h1 class="text-5xl font-black mb-4 uppercase tracking-tighter italic text-blue-500">Shop Online</h1>
    </header>

    <section class="max-w-6xl mx-auto px-6 pb-20">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="products-list">
            <p class="text-gray-500 text-center col-span-full">Загрузка товаров...</p>
        </div>
    </section>

    <!-- Окно входа -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-[100]">
        <div class="glass p-8 rounded-[40px] max-w-md w-full">
            <h2 class="text-2xl font-bold mb-6 text-center">Вход</h2>
            <input id="auth-email" type="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 text-white outline-none">
            <input id="auth-password" type="password" placeholder="Пароль" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-6 text-white outline-none">
            
            <button onclick="handleLogin()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold mb-3">ВОЙТИ</button>
            <button onclick="handleSignUp()" class="w-full border border-white/20 p-4 rounded-2xl font-bold mb-3">РЕГИСТРАЦИЯ</button>
            <button onclick="closeAuthModal()" class="w-full text-gray-500 text-sm">Закрыть</button>
        </div>
    </div>

    <script>
        // ВАЖНО: Проверь свои ключи! 
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co';
                const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C'; 

        const sb = supabase.createClient(SB_URL, SB_KEY);

        // Открытие модалки
        function showAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-modal').classList.add('flex');
        }
        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('flex');
        }

        // Загрузка товаров
        async function loadProducts() {
            try {
                // Пытаемся взять товары (и маленькая, и большая буква на всякий случай)
                const { data, error } = await sb.from('Products').select('*');
                if (error) throw error;

                const list = document.getElementById('Products-list');
                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-center col-span-full">Товаров нет. Добавь их в таблицу products!</p>';
                    return;
                }

                list.innerHTML = data.map(p => `
                    <div class="glass p-8 rounded-[40px] border border-white/5">
                        <div class="text-5xl mb-4">📦</div>
                        <h3 class="text-xl font-bold">${p.name}</h3>
                        <p class="text-gray-500 text-sm mb-6">${p.description || 'No description'}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-2xl font-black">${p.price || 0} ₽</span>
                            <button class="bg-blue-600 px-4 py-2 rounded-xl font-bold">BUY</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                alert("Ошибка загрузки товаров: " + err.message);
            }
        }

        // Авторизация
        async function handleSignUp() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { data, error } = await sb.auth.signUp({ email, password });
            if (error) alert("Ошибка: " + error.message);
            else alert("Успех! Письмо подтверждения (если включено) отправлено или теперь можно войти.");
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { data, error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert("Ошибка: " + error.message);
            else location.reload();
        }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                document.getElementById('auth-section').innerHTML = `
                    <div class="text-right">
                        <div class="text-blue-400 font-bold">0 ₽</div>
                        <div class="text-[10px] text-gray-500">${user.email}</div>
                    </div>
                `;
            }
        }

        loadProducts();
        checkUser();
    </script>
</body>
</html>
