<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMPRODA PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --bg: #000; --card: #0d0d0d; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: #fff; margin: 0; padding-bottom: 110px; overflow-x: hidden; }
        .boss-card { background: var(--card); border-radius: 24px; border: 1px solid rgba(255, 215, 0, 0.1); }
        .btn-gold { background: linear-gradient(180deg, #FFD700 0%, #BA8B02 100%); color: #000; font-weight: 900; text-transform: uppercase; border-radius: 14px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(5,5,5,0.98); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,215,0,0.1); padding: 12px 0; display: flex; justify-content: space-around; z-index: 10000; }
        .nav-item { color: #444; font-size: 8px; font-weight: 800; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .nav-item.active { color: var(--gold); }
        .progress-bg { background: #1a1a1a; height: 6px; border-radius: 10px; overflow: hidden; position: relative; }
        .progress-fill { background: var(--gold); height: 100%; transition: 0.5s; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        input { background: #1a1b22 !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 12px; padding: 16px; color: #fff; width: 100%; outline: none; }
    </style>
</head>
<body>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-2 rounded-full font-black text-[10px] z-[60000] hidden uppercase"></div>

    <!-- МОДАЛКА ОПЛАТЫ -->
    <div id="m-pay" class="modal hidden">
        <div class="boss-card w-full max-w-sm p-8 text-center">
            <h2 id="p-name" class="text-yellow-500 font-black uppercase text-xl mb-6 italic"></h2>
                        <div class="bg-[#1a1b22] p-4 rounded-xl border border-white/5 text-left mb-6">
                <p class="text-[8px] opacity-40 font-black uppercase mb-1">Т-Банк / СБП</p>
                <p class="font-bold text-yellow-500 text-sm">+7 950 170 07 87</p>
            </div>
            <p id="p-total" class="text-3xl font-black text-white mb-8"></p>
            <div class="flex gap-4">
                <button onclick="document.getElementById('m-pay').classList.add('hidden')" class="w-1/3 text-[10px] font-bold opacity-30 uppercase">Назад</button>
                <button onclick="processOrder()" class="w-2/3 btn-gold py-4 text-[10px]">Я оплатил(а)</button>
            </div>
        </div>
    </div>

    <main id="app" class="px-4 pt-6"></main>

    <nav class="nav-bar">
        <div onclick="render('shop')" id="n-shop" class="nav-item active">🛒<span>Шоп</span></div>
        <div onclick="render('info')" id="n-info" class="nav-item">📖<span>Инфо</span></div>
        <div onclick="render('reviews')" id="n-reviews" class="nav-item">⭐<span>Отзывы</span></div>
        <div onclick="render('status')" id="n-status" class="nav-item">👤<span>Статус</span></div>
        <div onclick="render('promo')" id="n-promo" class="nav-item">🎫<span>Ваучер</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co'; 
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C';
        const BOT_TOKEN = '8730430332:AAGff_PCX2059o3EUwG-d9C19uTqcH4sAZ4';
        const ADMIN_ID = '7727345054';

        const sb = supabase.createClient(SB_URL, SB_KEY);
        let products = [], activeItem = null;
        const tgUser = tg.initDataUnsafe?.user || { id: 7727345054, username: 'nmproda' };

        async function render(page) {
            const app = document.getElementById('app');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('n-' + page).classList.add('active');
            app.innerHTML = '';

            if (page === 'shop') {                app.innerHTML = `<h1 class="text-xl font-black italic text-yellow-500 uppercase text-center mb-6">BOSS STORE</h1><div id="grid" class="grid grid-cols-2 gap-4"></div>`;
                const { data } = await sb.from('products').select('*');
                products = data || [];
                document.getElementById('grid').innerHTML = products.map(p => `
                    <div class="boss-card flex flex-col bg-[#0d0d0d]">
                        <img src="${p.image_url}" class="w-full aspect-square object-cover opacity-80">
                        <div class="p-4">
                            <h3 class="text-[9px] font-black text-yellow-500 uppercase mb-1">${p.name}</h3>
                            <p class="text-sm font-black text-white italic mb-4">${p.price}.00 ₽</p>
                            <button onclick="checkStock('${p.id}')" class="btn-gold w-full py-3 text-[10px]">ШОП</button>
                        </div>
                    </div>`).join('');
            } 
            else if (page === 'info') {
                app.innerHTML = `
                    <h2 class="text-yellow-500 font-black text-center text-xl mb-8 uppercase italic">ИНФО</h2>
                    <div class="boss-card p-6">
                        <p class="text-[11px] opacity-60 leading-relaxed mb-6 italic">Добро пожаловать в BOSS STORE. Ниже вы найдете инструкцию по работе с нашими аккаунтами.</p>
                        <a href="https://instructions-nine.vercel.app/" class="text-yellow-500 font-black text-[11px] uppercase border-b border-yellow-500 pb-1">Читать полную инструкцию</a>
                    </div>`;
            }
            else if (page === 'status') {
                const { data: prof } = await sb.from('profiles').select('*').eq('id', tgUser.id).single();
                const progress = prof ? (prof.total_spent / 100000) * 100 : 0;
                const regDate = prof ? new Date(prof.created_at).toLocaleDateString() : '21.04.2026';

                app.innerHTML = `
                <div class="boss-card p-6">
                    <h2 class="text-yellow-500 font-black text-[10px] uppercase mb-10 italic">BOSS VIP STATUS</h2>
                    <div class="mb-10">
                        <div class="flex justify-between text-[8px] font-black uppercase opacity-40 mb-2">
                            <span>Progress to 100k</span>
                            <span>${(prof?.total_spent || 0).toFixed(2)} / 100 000.00 ₽</span>
                        </div>
                        <div class="progress-bg"><div class="progress-fill" style="width: ${progress}%"></div></div>
                    </div>
                    <div class="grid grid-cols-2 gap-y-8 mb-12">
                        <div><p class="text-[8px] opacity-30 font-black uppercase">ID Клиента</p><p class="text-[10px] font-black">${tgUser.id}</p></div>
                        <div><p class="text-[8px] opacity-30 font-black uppercase">Юзер</p><p class="text-[10px] font-black">@${tgUser.username || 'nmproda'}</p></div>
                        <div><p class="text-[8px] opacity-30 font-black uppercase">Скидка</p><p class="text-yellow-500 font-black text-[10px]">0%</p></div>
                        <div><p class="text-[8px] opacity-30 font-black uppercase">Рег</p><p class="text-[10px] font-black">${regDate}</p></div>
                    </div>
                    <div>
                        <p class="text-[8px] opacity-30 font-black uppercase mb-4 italic">История покупок:</p>
                        <p class="text-[9px] font-black opacity-20 uppercase tracking-widest text-center py-4">Покупок нет</p>
                    </div>
                </div>`;
            }
            else if (page === 'reviews') {
                const { data } = await sb.from('reviews').select('*').order('created_at', {ascending: false});
                app.innerHTML = `<h2 class="text-yellow-500 font-black text-center text-xl mb-8 uppercase italic">ОТЗЫВЫ</h2>
                    <div class="space-y-4 pb-10">${(data || []).map(r => `
                    <div class="boss-card p-5"><p class="text-yellow-500 font-black text-[8px] uppercase mb-2">${r.user_email}</p>
                    <p class="text-[10px] italic opacity-70">${r.text}</p></div>`).join('')}</div>`;
            }
            else if (page === 'promo') {
                app.innerHTML = `<h2 class="text-yellow-500 font-black text-center text-xl mb-8 uppercase italic">ВАУЧЕР</h2>
                    <div class="pt-4"><input id="v-in" placeholder="КОД ВАУЧЕРА" class="mb-4">
                    <button onclick="applyV()" class="btn-gold w-full py-4 text-[11px]">АКТИВИРОВАТЬ</button></div>`;
            }
        }

        async function checkStock(id) {
            const p = products.find(x => x.id === id);
            if (!p || p.stock <= 0) return showToast("ИЗВИНИТЕ, ТАКОГО ТОВАРА НЕТ В НАЛИЧИИ");
            activeItem = p;
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-total').innerText = p.price + '.00 ₽';
            document.getElementById('m-pay').classList.remove('hidden');
        }

        async function processOrder() {
            // Сообщение для КЛИЕНТА (С твоим текстом и ссылками)
            const clientMsg = `Спасибо за покупку. Твой аккаунт уже ждёт тебя ⭐️. Пиши сюда @nmproda, если спамблок <a href="https://t.me/+6p6zsbaMA443YmJh">перейди в группу</a> и напиши @nmproda.`;

            try {
                // Уведомление ТЕБЕ (Админу)
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: ADMIN_ID, 
                        text: `🛒 НОВЫЙ ЗАКАЗ\nЮзер: @${tgUser.username}\nТовар: ${activeItem.name}\nСумма: ${activeItem.price} ₽\n\nВыдай аккаунт!` 
                    })
                });

                // Сообщение КЛИЕНТУ
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: tgUser.id, 
                        parse_mode: 'HTML',
                        text: clientMsg 
                    })
                });

                document.getElementById('m-pay').classList.add('hidden');
                showToast("ЗАКАЗ ПРИНЯТ! ПРОВЕРЬТЕ БОТА");
            } catch (e) { showToast("ОШИБКА ОПЛАТЫ"); }
        }

        function showToast(t) { const s = document.getElementById('toast'); s.innerText = t; s.classList.remove('hidden'); setTimeout(()=>s.classList.add('hidden'), 3000); }
        
        document.addEventListener('DOMContentLoaded', () => { tg.expand(); render('shop'); });
    </script>
</body>
</html>
