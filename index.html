<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG-STORE | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-blue { background: #2563eb; transition: all 0.2s; }
        .btn-blue:active { transform: scale(0.95); opacity: 0.8; }
        input { border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.2s; }
        input:focus { border-color: #2563eb; outline: none; }
    </style>
</head>
<body class="font-sans">

    <!-- Навигация -->
    <nav class="flex justify-between items-center p-4 sticky top-0 bg-[#050505]/90 backdrop-blur-md z-50 border-b border-white/5">
        <div class="text-xl font-black text-blue-500 uppercase tracking-tighter">TG-MILLIONAIRE</div>
        <div id="user-info" class="text-right">
            <button onclick="openModal('auth-modal')" class="glass px-4 py-1.5 rounded-lg text-sm font-bold">ВОЙТИ</button>
        </div>
    </nav>

    <!-- Поиск и Заголовок -->
    <div class="p-4 max-w-2xl mx-auto">
        <input type="text" id="search" oninput="filterItems()" placeholder="Поиск товара..." 
               class="w-full bg-white/5 p-3 rounded-xl text-sm mb-6">
        
        <div id="products-grid" class="grid grid-cols-1 gap-3">
            <div class="text-center text-gray-500 py-10">Загрузка витрины...</div>
        </div>
    </div>

    <!-- МОДАЛКА: ВХОД / РЕГИСТРАЦИЯ -->
    <div id="auth-modal" class="fixed inset-0 bg-black/95 hidden items-center justify-center p-4 z-[100]">
        <div class="glass p-6 rounded-3xl w-full max-w-sm">
            <h2 id="auth-title" class="text-xl font-bold mb-6 text-center text-blue-400">Личный кабинет</h2>
            
            <input id="email" type="email" placeholder="Email" class="w-full bg-white/5 p-3 rounded-xl mb-3">
            <input id="password" type="password" placeholder="Пароль" class="w-full bg-white/5 p-3 rounded-xl mb-4">
            
            <div class="space-y-3">
                <button id="login-btn" onclick="authAction('login')" class="w-full btn-blue p-3 rounded-xl font-bold">ВОЙТИ</button>
                                <button id="signup-btn" onclick="authAction('signup')" class="w-full bg-white/5 p-3 rounded-xl font-bold text-sm">РЕГИСТРАЦИЯ</button>
                <button onclick="resetPassword()" class="w-full text-gray-500 text-xs py-2">Забыли пароль?</button>
            </div>
            
            <button onclick="closeModal('auth-modal')" class="w-full mt-4 text-gray-600 text-sm italic">Закрыть</button>
        </div>
    </div>

    <script>
        // --- КЛЮЧИ (АВТО-ОЧИСТКА ОТ ПРОБЕЛОВ) ---
        const SB_URL = 'ВСТАВЬ_СЮДА_URL'.trim();
        const SB_KEY = 'ВСТАВЬ_СЮДА_KEY'.trim();
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let allItems = [];

        // Управление модалками
        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        // Загрузка товаров
        async function fetchProducts() {
            try {
                const { data, error } = await sb.from('products').select('*');
                if (error) throw error;
                allItems = data;
                render(allItems);
            } catch (e) {
                document.getElementById('products-grid').innerHTML = `<div class="text-red-500 text-xs">Ошибка базы: ${e.message}</div>`;
            }
        }

        function render(items) {
            const grid = document.getElementById('products-grid');
            if (!items.length) { grid.innerHTML = '<div class="text-gray-600 text-center">Товары не найдены</div>'; return; }
            
            grid.innerHTML = items.map(p => `
                <div class="glass p-3 rounded-2xl flex items-center justify-between border-white/5">
                    <div class="flex items-center gap-3">
                        <div class="text-2xl bg-white/5 w-10 h-10 flex items-center justify-center rounded-lg">📦</div>
                        <div>
                            <div class="font-bold text-sm uppercase">${p.name}</div>
                            <div class="text-[10px] text-gray-500 uppercase">${p.description || 'Аккаунт'}</div>
                        </div>
                                </div>
                                                    <div class="flex items-center gap-3">
                        <div class="font-black text-blue-400">${p.price}₽</div>
                        <button onclick="alert('Пополните баланс!')" class="btn-blue px-4 py-1.5 rounded-lg text-xs font-bold uppercase italic">Buy</button>
                    </div>
                </div>
            `).join('');
        }

        function filterItems() {
            const q = document.getElementById('search').value.toLowerCase();
            render(allItems.filter(i => i.name.toLowerCase().includes(q)));
        }

        // Авторизация
        async function authAction(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = type === 'login' ? document.getElementById('login-btn') : document.getElementById('signup-btn');
            
            if (!email || !password) return alert("Заполни поля!");
            
            btn.innerText = "Ждите...";
            btn.classList.add('opacity-50');

            const { data, error } = type === 'login' 
                ? await sb.auth.signInWithPassword({ email, password })
                : await sb.auth.signUp({ email, password });

            if (error) {
                alert("Ошибка: " + error.message);
                btn.innerText = type === 'login' ? "ВОЙТИ" : "РЕГИСТРАЦИЯ";
                btn.classList.remove('opacity-50');
            } else {
                if (type === 'signup') alert("Регистрация успешна! Если ты отключила подтверждение почты в Supabase — просто нажми ВОЙТИ.");
                else location.reload();
            }
        }

        // Восстановление пароля
        async function resetPassword() {
            const email = document.getElementById('email').value;
            if (!email) return alert("Введите Email в поле выше!");
            
            const { error } = await sb.auth.resetPasswordForEmail(email);
            if (error) alert(error.message);
            else alert("Инструкция по сбросу пароля отправлена на твою почту!");
        }

        // Проверка юзера
        async function check() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                document.getElementById('user-info').innerHTML = `
                    <div class="flex flex-col items-end">
                        <span class="text-blue-500 font-black text-sm">0 ₽</span>
                        <span class="text-[9px] text-gray-600">${user.email}</span>
                        <button onclick="sb.auth.signOut().then(() => location.reload())" class="text-[8px] text-red-800 uppercase">Выход</button>
                    </div>
                `;
            }
        }

        fetchProducts();
        check();
    </script>
</body>
</html>
