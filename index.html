<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOSS STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --bg: #000; --card: #0d0d0d; --neon: #ff00ff; }
        .light-mode { --bg: #f0f0f0; --card: #ffffff; --text: #000; --border: #ddd; }
        
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: #fff; margin: 0; padding-bottom: 110px; overflow-x: hidden; -webkit-tap-highlight-color: transparent; transition: 0.3s; }
        body.light-mode { color: #000; }

        .neon-frame { position: fixed; inset: 0; border: 3px solid var(--neon); box-shadow: inset 0 0 15px var(--neon), 0 0 15px var(--neon); z-index: 9998; pointer-events: none; display: none; opacity: 0.6; animation: breathe 1.5s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
        .promo-active .neon-frame { display: block; }

        .boss-card { background: var(--card); border-radius: 18px; border: 1px solid rgba(255, 215, 0, 0.08); overflow: hidden; position: relative; transition: 0.4s; }
        .btn-gold { background: linear-gradient(180deg, #FFD700 0%, #BA8B02 100%); color: #000; font-weight: 900; text-transform: uppercase; border-radius: 12px; }
        
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(5,5,5,0.96); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,215,0,0.1); padding: 12px 0; display: flex; justify-content: space-around; z-index: 10000; }
        .nav-item { color: #444; font-size: 8px; font-weight: 800; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; transition: 0.3s; }
        .nav-item.active { color: var(--gold); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 20000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .hidden { display: none !important; }
                input { background: #1a1a1a !important; border: 1px solid rgba(255,215,0,0.2) !important; border-radius: 12px; padding: 14px; color: #fff; font-weight: 900; text-align: center; outline: none; width: 100%; }
        .cat-scroll { display: flex; overflow-x: auto; gap: 15px; padding: 10px 0 20px; scrollbar-width: none; }
        .cat-item { white-space: nowrap; font-size: 9px; font-weight: 900; color: #333; text-transform: uppercase; transition: 0.3s; }
        .cat-item.active { color: var(--gold); border-bottom: 2px solid var(--gold); }
    </style>
</head>
<body id="b-tag">

    <div class="neon-frame"></div>
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-2 rounded-full font-black text-[10px] z-[30000] hidden uppercase">Скопировано</div>

    <main id="app" class="px-4 pt-6"></main>

    <!-- Окно покупки -->
    <div id="m-pay" class="modal hidden">
        <div class="boss-card w-full max-w-sm p-6 text-center bg-[#0a0a0a]">
            <h2 id="p-name" class="text-yellow-500 font-black italic uppercase mb-6 text-xl italic"></h2>
            
            <!-- Реквизиты (Твои старые) -->
            <div class="space-y-2 mb-6 text-left">
                <div onclick="copy('+79501700787')" class="bg-white/5 p-4 rounded-xl border border-white/5">
                    <p class="text-[7px] opacity-40 font-black uppercase">💛 Т-Банк / СБП</p>
                    <p class="font-bold text-yellow-500 text-sm">+7 950 170 07 87</p>
                </div>
            </div>

            <div class="mb-6">
                <p class="text-[9px] font-black opacity-40 uppercase">К оплате:</p>
                <p id="p-total" class="text-2xl font-black text-yellow-500">0.00 ₽</p>
            </div>

            <div class="flex gap-3">
                <button onclick="closeM()" class="w-1/3 py-4 text-[9px] font-black opacity-30 uppercase">НАЗАД</button>
                <button onclick="order()" class="w-2/3 btn-gold py-4 text-[10px]">Я ОПЛАТИЛ(А)</button>
            </div>
        </div>
    </div>

    <!-- Навигация -->
    <nav class="nav-bar">
        <div onclick="render('shop')" id="n-shop" class="nav-item active">🛒<span>Шоп</span></div>
                <div onclick="render('luck')" id="n-luck" class="nav-item">🎰<span>Удача</span></div>
        <div onclick="render('news')" id="n-news" class="nav-item">📰<span>Статьи</span></div>
        <div onclick="render('status')" id="n-status" class="nav-item">👤<span>Профиль</span></div>
        <div onclick="render('promo')" id="n-promo" class="nav-item">🎫<span>Ваучер</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co';
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C';
        const BOT_TOKEN = '8780961369:AAHsQp2Fi4N1swxLkpE2Jxn74fvv4qitJLM';
        const ADMIN_ID = '7727345054';

        const sb = supabase.createClient(SB_URL, SB_KEY);
        tg.ready(); tg.expand();

        let state = JSON.parse(localStorage.getItem('BOSS_V32')) || { discount: 0, lastLuck: 0, lang: 'ru', theme: 'dark' };
        let products = [], curCat = 'BCE', activeItem = null, user = null;

        // --- ГЛАВНЫЙ РЕНДЕР ---
        async function render(page) {
            const app = document.getElementById('app');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('n-' + page).classList.add('active');

            if (page === 'shop') {
                app.innerHTML = `<h1 class="text-xl font-black italic text-yellow-500 uppercase text-center mb-2">BOSS STORE</h1><div class="cat-scroll" id="cat-bar"></div><div id="grid" class="grid grid-cols-2 gap-4 pb-10"></div>`;
                if(products.length === 0) {
                    const { data } = await sb.from('products').select('*');
                    products = data || [];
                }
                const cats = ['BCE', ...new Set(products.map(p => p.category))];
                document.getElementById('cat-bar').innerHTML = cats.map(c => `<div onclick="setCat('${c}')" class="cat-item ${curCat===c?'active':''}">${c}</div>`).join('');
                setCat(curCat);
            } 
            
            else if (page === 'status') {
                const { data: { session } } = await sb.auth.getSession();
                if(!session) {
                    app.innerHTML = `<div class="space-y-4 pt-10"><input id="reg-login" placeholder="ЛОГИН"><input id="reg-email" placeholder="EMAIL"><input id="reg-pass" type="password" placeholder="ПАРОЛЬ"><button onclick="auth('up')" class="btn-gold w-full py-4 text-xs">РЕГИСТРАЦИЯ</button><button onclick="auth('in')" class="opacity-40 w-full text-[10px] uppercase font-bold">ВХОД</button><button onclick="resetP()" class="opacity-20 w-full text-[8px] uppercase">Забыли пароль?</button></div>`;
                } else {
                    const { data: prof } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
                    app.innerHTML = `<div class="boss-card p-6 text-center"><p class="text-[10px] opacity-40 mb-2 uppercase font-black">Ваш баланс</p><h2 class="text-5xl font-black text-yellow-500 italic mb-10">${prof.balance} ₽</h2><div class="grid grid-cols-2 gap-4"><button onclick="toggleTheme()" class="bg-white/5 p-4 rounded-xl text-[10px] uppercase font-bold">Тема 🌓</button><button onclick="changeL()" class="bg-white/5 p-4 rounded-xl text-[10px] uppercase font-bold">Язык: ${state.lang.toUpperCase()}</button></div><button onclick="sb.auth.signOut().then(()=>location.reload())" class="mt-10 text-red-500 text-[10px] font-bold uppercase">Выйти</button></div>`;
                }
            }

            else if (page === 'news') {
                const { data } = await sb.from('articles').select('*');
                app.innerHTML = `<h2 class="text-yellow-500 font-black text-center text-xl mb-8 uppercase italic">Статьи BOSS</h2><div class="space-y-4">${data.map(n => `<div class="boss-card p-5"><h4 class="text-yellow-500 font-black text-xs uppercase mb-2">${n.title}</h4><p class="text-[10px] opacity-60 leading-relaxed">${n.content}</p></div>`).join('')}</div>`;
            }

            else if (page === 'promo') {
                app.innerHTML = `<div class="pt-6"><h2 class="text-yellow-500 font-black text-center mb-8 uppercase italic">Активация Ваучера</h2><input id="v-in" placeholder="ВВЕДИТЕ КОД"><button onclick="applyV()" class="btn-gold w-full py-4 mt-4 text-xs">АКТИВИРОВАТЬ</button></div>`;
            }
            
            else if (page === 'luck') { /* Твой старый код скретча */ app.innerHTML = `<div class="text-center pt-10"><h2 class="text-yellow-500 font-black italic text-xl uppercase mb-10">Скретч-карта</h2><div id="scr-wrap" class="mx-auto bg-[#111] rounded-3xl relative overflow-hidden" style="width:300px;height:180px;"><canvas id="can" style="position:absolute;inset:0;"></canvas><div class="flex items-center justify-center h-full text-4xl font-black text-yellow-500">${state.discount}% СКИДКА</div></div></div>`; initScr(); }
        }

        // --- ЛОГИКА ---
        function setCat(c) {
            curCat = c;
            const grid = document.getElementById('grid');
            const filt = c === 'BCE' ? products : products.filter(p => p.category === c);
            grid.innerHTML = filt.map(p => `
                <div class="boss-card flex flex-col h-full">
                    <img src="${p.img}" class="w-full aspect-square object-cover opacity-80">
                    <div class="p-3 flex-1 flex flex-col">
                        <h3 class="text-[9px] font-black text-yellow-500 uppercase truncate mb-1">${p.name}</h3>
                        <p class="text-[10px] font-black italic mb-4">${p.price} ₽</p>
                        <button onclick="openPay('${p.name}', ${p.price})" class="mt-auto btn-gold w-full py-2 text-[9px]">КУПИТЬ</button>
                    </div>
                </div>
            `).join('');
        }

        async function auth(mode) {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const login = document.getElementById('reg-login').value;
            if(mode === 'up') await sb.auth.signUp({ email, password: pass, options: { data: { user_name: login } } });
            else await sb.auth.signInWithPassword({ email, password: pass });
            location.reload();
        }

        async function applyV() {
            const code = document.getElementById('v-in').value.trim();
            const { data: v } = await sb.from('vouchers').select('*').eq('code', code).eq('is_used', false).single();
            if(!v) return copy('Ошибка кода!');
            const { data: { user } } = await sb.auth.getUser();
            const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
            await sb.from('profiles').update({ balance: prof.balance + v.value }).eq('id', user.id);
            await sb.from('vouchers').update({ is_used: true }).eq('id', v.id);
            render('status');
        }

        async function order() {
            const { data: { user: u } } = await sb.auth.getUser();
            if(!u) return render('status');
            
            const { data: acc } = await sb.from('accounts_data').select('*').eq('product_name', activeItem.n).eq('is_sold', false).limit(1).single();
            if(!acc) return copy('ТОВАР ЗАКОНЧИЛСЯ');

            const text = `🔥 НОВЫЙ ЗАКАЗ 🔥\nТовар: ${activeItem.n}\nДанные: ${acc.data}\nЦена: ${activeItem.p} ₽\nЮзер: ${u.email}`;
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_ID}&text=${encodeURIComponent(text)}`);
            
            copy('ДАННЫЕ ОТПРАВЛЕНЫ В БОТА!');
            closeM();
        }

        function openPay(n, p) { 
            activeItem = {n, p}; 
            document.getElementById('p-name').innerText = n;
            document.getElementById('p-total').innerText = p + ' ₽';
            document.getElementById('m-pay').classList.remove('hidden'); 
        }
        function closeM() { document.getElementById('m-pay').classList.add('hidden'); }
        function copy(t) { 
            const toast = document.getElementById('toast');
            toast.innerText = t; toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
            navigator.clipboard.writeText(t);
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function changeL() { state.lang = state.lang === 'ru' ? 'en' : 'ru'; save(); render('status'); }
        function save() { localStorage.setItem('BOSS_V32', JSON.stringify(state)); }

        render('shop');
    </script>
</body>
</html>
