<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS STORE | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --card: #111111; --text: #ffffff; --accent: #2563eb; --border: rgba(255,255,255,0.1); }
        .light-mode { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --accent: #2563eb; --border: rgba(0,0,0,0.05); }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; margin: 0; }
        .boss-font { font-family: 'Syncopate', sans-serif; }
        .boss-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; transition: 0.2s; overflow: hidden; }
        .boss-card:hover { border-color: var(--accent); }
        
        /* Боковое меню */
        #side-menu { position: fixed; top: 0; right: -100%; width: 300px; height: 100%; background: var(--card); z-index: 1000; transition: 0.4s; border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0,0,0,0.5); }
        #side-menu.open { right: 0; }
        .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 900; backdrop-filter: blur(4px); }
        .menu-overlay.open { display: block; }

        .btn-main { background: var(--accent); color: white; font-weight: 800; border-radius: 10px; transition: 0.2s; }
        .btn-main:active { transform: scale(0.95); }
        
        input { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); outline: none; padding: 12px; border-radius: 12px; }
        .section-hidden { display: none; }
    </style>
</head>
<body>

    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- ШАПКА -->
    <nav class="sticky top-0 z-50 bg-inherit border-b border-white/5 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="boss-font text-lg font-bold tracking-tighter text-blue-600 cursor-pointer" onclick="showSection('shop')">BOSSSTORE</div>
            <div class="flex items-center gap-4">
                                <button onclick="toggleTheme()" class="text-lg">🌓</button>
                <!-- ТРИ ПОЛОСКИ -->
                <button onclick="toggleMenu()" class="flex flex-col gap-1.5 items-end">
                    <div class="w-6 h-0.5 bg-current"></div>
                    <div class="w-6 h-0.5 bg-current"></div>
                    <div class="w-4 h-0.5 bg-blue-600"></div>
                </button>
            </div>
        </div>
    </nav>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="max-w-6xl mx-auto p-4">
        
        <!-- СЕКЦИЯ: МАГАЗИН -->
        <div id="sec-shop" class="section">
            <header class="my-10">
                <h1 id="hero-text" class="text-4xl md:text-6xl font-black italic uppercase leading-none mb-6">EXCLUSIVE<br><span class="text-blue-600">ACCESS</span></h1>
                <input type="text" id="search" oninput="doSearch()" placeholder="Поиск товара..." class="w-full text-sm">
            </header>
            <div id="products-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="col-span-full text-center py-20 opacity-20 italic">Загрузка товаров...</div>
            </div>
        </div>

        <!-- СЕКЦИЯ: СТАТЬИ -->
        <div id="sec-news" class="section section-hidden">
            <h2 class="text-3xl font-black italic uppercase mb-8">Articles</h2>
            <div id="news-list" class="grid gap-4"></div>
        </div>

        <!-- СЕКЦИЯ: ОТЗЫВЫ -->
        <div id="sec-reviews" class="section section-hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black italic uppercase">Reviews</h2>
                <button onclick="bossAlert('Функция добавления скоро будет!', '✍️')" class="btn-main px-4 py-2 text-[10px]">Добавить</button>
            </div>
            <div id="reviews-list" class="grid gap-4"></div>
        </div>

    </main>

    <!-- БОКОВОЕ МЕНЮ (ПРОФИЛЬ) -->
    <div id="side-menu" class="p-8">
        <div class="flex justify-between items-center mb-10">
            <span class="boss-font text-xs opacity-40">BOSS TERMINAL</span>
            <button onclick="toggleMenu()" class="text-2xl">✕</button>
                    </div>

        <!-- Если не вошел -->
        <div id="auth-box" class="space-y-4">
            <input id="email" type="email" placeholder="Email" class="w-full text-xs">
            <input id="pass" type="password" placeholder="Password" class="w-full text-xs">
            <button onclick="handleAuth('login')" class="w-full btn-main p-4 text-xs uppercase italic">Войти</button>
            <button onclick="handleAuth('signup')" class="w-full border border-white/10 p-3 rounded-xl text-[9px] uppercase font-bold opacity-50">Регистрация</button>
            <button onclick="resetPassword()" class="w-full text-center text-[9px] opacity-30 uppercase font-black">Забыли пароль?</button>
        </div>

        <!-- Если вошел -->
        <div id="user-box" class="hidden space-y-8">
            <div>
                <p class="text-[9px] opacity-40 uppercase font-black mb-1">My Balance</p>
                <h3 id="bal-display" class="text-4xl font-black text-blue-600 italic">0 ₽</h3>
            </div>
            <nav class="flex flex-col gap-5 text-xs font-black uppercase tracking-widest italic">
                <button onclick="showSection('shop')" class="text-left hover:text-blue-600">📦 Магазин</button>
                <button onclick="showSection('news')" class="text-left hover:text-blue-600">📄 Статьи</button>
                <button onclick="showSection('reviews')" class="text-left hover:text-blue-600">⭐ Отзывы</button>
                <button onclick="openVoucher()" class="text-left text-blue-400">💰 Пополнить</button>
                <div class="flex gap-4 pt-4 border-t border-white/5">
                    <button onclick="changeLang('ru')">RU</button>
                    <button onclick="changeLang('en')">EN</button>
                </div>
                <button onclick="logout()" class="text-left text-red-600 mt-10">Выйти</button>
            </nav>
        </div>
    </div>

    <!-- МОДАЛКА ВМЕСТО ALERT -->
    <div id="boss-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center z-[2000] p-6">
        <div class="boss-card p-8 w-full max-w-xs text-center border-blue-600/30">
            <div id="m-icon" class="text-5xl mb-4">💡</div>
            <p id="m-text" class="text-sm font-bold mb-6 italic"></p>
            <button onclick="closeModal('boss-modal')" class="w-full btn-main p-4 text-xs uppercase italic">Принято</button>
        </div>
    </div>

    <script>
        // --- ПОДКЛЮЧЕНИЕ (ВСТАВЬ СВОИ ДАННЫЕ) ---
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co'.trim();
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C'.trim();
        const TG_TOKEN = '8780961369:AAHsQp2Fi4N1swxLkpE2Jxn74fvv4qitJLM';
        const TG_CHAT_ID = '7727345054';
        
        const sb = supabase.createClient(SB_URL, SB_KEY);
        let products = [];

        // --- ЛОГИКА ИНТЕРФЕЙСА ---
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.add('section-hidden'));
            document.getElementById(`sec-${id}`).classList.remove('section-hidden');
            if(id === 'news') loadNews();
            if(id === 'reviews') loadReviews();
            toggleMenu();
        }

        function bossAlert(text, icon = '💡') {
            document.getElementById('m-text').innerText = text;
            document.getElementById('m-icon').innerText = icon;
            document.getElementById('boss-modal').classList.replace('hidden', 'flex');
        }

        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        // --- ЗАГРУЗКА ДАННЫХ ---
        async function loadProducts() {
            const { data, error } = await sb.from('products').select('*');
            if(error) return bossAlert('Ошибка базы: ' + error.message, '❌');
            products = data || [];
            renderProducts(products);
        }

        function renderProducts(list) {
            const grid = document.getElementById('products-grid');
            if(list.length === 0) { grid.innerHTML = '<p class="col-span-full opacity-30 text-center">Товаров пока нет.</p>'; return; }
            grid.innerHTML = list.map(p => `
                <div class="boss-card p-4 flex flex-col justify-between">
                    <div class="mb-4">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[7px] font-black text-blue-600 uppercase italic">Premium</span>
                            <span class="text-xs font-black italic">${p.price} ₽</span>
                        </div>
                        <h3 class="text-[10px] font-black uppercase italic truncate leading-tight">${p.name}</h3>
                    </div>
                    <button onclick="buyItem('${p.name}', ${p.price})" class="btn-main w-full py-2 text-[9px] uppercase italic">Get Access</button>
                    </div>
            `).join('');
        }

        function doSearch() {
            const q = document.getElementById('search').value.toLowerCase();
            renderProducts(products.filter(p => p.name.toLowerCase().includes(q)));
        }

        // --- БИЗНЕС ЛОГИКА ---
        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { error } = type === 'login' 
                ? await sb.auth.signInWithPassword({ email, password })
                : await sb.auth.signUp({ email, password });
            if(error) bossAlert(error.message, '❌'); else location.reload();
        }

        async function buyItem(name, price) {
            const { data: { user } } = await sb.auth.getUser();
            if(!user) { toggleMenu(); return; }

            const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
            if(prof.balance < price) return bossAlert('Недостаточно BOSS-баланса!', '💸');

            const { data: acc } = await sb.from('accounts_data').select('*').eq('product_name', name).eq('is_sold', false).limit(1).single();
            if(!acc) return bossAlert(`Товар "${name}" закончился в базе!`, '⏳');

            await sb.from('profiles').update({ balance: prof.balance - price }).eq('id', user.id);
            await sb.from('accounts_data').update({ is_sold: true }).eq('id', acc.id);

            bossAlert(`УСПЕШНО!\nДанные: ${acc.data}`, '💎');
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent('BOSS BUY: '+name+'\nData: '+acc.data)}`);
            updateUI();
        }

        async function updateUI() {
            const { data: { user } } = await sb.auth.getUser();
            if(user) {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('user-box').classList.remove('hidden');
                const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
                document.getElementById('bal-display').innerText = `${prof?.balance || 0} ₽`;
            }
        }

        async function loadNews() {
            const { data } = await sb.from('articles').select('*');
            document.getElementById('news-list').innerHTML = (data || []).map(n => `
                <div class="boss-card p-5">
                    <h4 class="font-black text-blue-600 uppercase italic mb-2">${n.title}</h4>
                    <p class="text-xs opacity-50">${n.content}</p>
                </div>
            `).join('');
        }

        async function loadReviews() {
            const { data } = await sb.from('reviews').select('*');
            document.getElementById('reviews-list').innerHTML = (data || []).map(r => `
                <div class="boss-card p-4 italic text-xs">"${r.text}"</div>
            `).join('');
        }

        function changeLang(l) {
            document.getElementById('hero-text').innerHTML = l === 'ru' ? 'EXCLUSIVE<br><span class="text-blue-600">ACCESS</span>' : 'PREMIUM<br><span class="text-blue-600">ACCESS</span>';
            bossAlert(l === 'ru' ? 'Язык изменен' : 'Language updated');
        }

        function logout() { sb.auth.signOut().then(() => location.reload()); }

        // Запуск
        loadProducts();
        updateUI();
    </script>
</body>
</html>
