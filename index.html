<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TEST API SYNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; }
        .item { border: 1px solid #333; padding: 10px; margin-bottom: 5px; border-radius: 8px; display: flex; justify-content: space-between; }
        .stock { color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>

    <h1 class="text-xl font-bold mb-5 text-yellow-500">ПРОВЕРКА СВЯЗИ С SMS-PRO.GURU</h1>
    
    <div id="status" class="mb-5 text-blue-400">Загрузка данных...</div>
    
    <div id="results">
        <!-- Тут появятся товары от поставщика -->
    </div>

    <script>
        async function testSync() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            
            // Используем прокси, так как браузеры часто блокируют прямые запросы (CORS)
            const proxy = 'https://api.allorigins.win/get?url=';
            const targetUrl = 'https://sms-pro.guru/buy/api/accounts/?category=TG_ACCOUNTS';

            try {
                const response = await fetch(proxy + encodeURIComponent(targetUrl));
                const data = await response.json();
                
                // Распаковываем данные (allorigins упаковывает их в поле contents)
                const supplierData = JSON.parse(data.contents);
                
                status.innerText = "✅ СВЯЗЬ УСТАНОВЛЕНА! Найдено товаров: " + (supplierData.length || 0);
                status.classList.remove('text-blue-400');
                status.classList.add('text-green-500');

                if (supplierData && supplierData.length > 0) {
                    results.innerHTML = supplierData.map(item => `
                        <div class="item">
                            <span>${item.name || 'Без названия'}</span>
                            <span class="stock">${item.count || 0} шт.</span>
                        </div>
                    `).join('');
                } else {
                    results.innerHTML = "Данные получены, но список товаров пуст.";
                }

            } catch (error) {
                console.error(error);
                status.innerText = "❌ ОШИБКА: Не удалось получить данные. Скорее всего, сайт поставщика блокирует запросы.";
                status.classList.remove('text-blue-400');
                status.classList.add('text-red-500');
            }
        }

        // Запускаем проверку сразу
        testSync();
    </script>
</body>
</html>
