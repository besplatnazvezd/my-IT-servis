<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMPRODA PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #FFD700; --bg: #000; --card: #0d0d0d; --text: #fff; --gray: #555; --border: rgba(255, 215, 0, 0.1); }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 100px; min-height: 100vh; }
        body.promo-active::after { content: ''; position: fixed; inset: 0; pointer-events: none; border: 4px solid #a855f7; box-shadow: inset 0 0 50px rgba(168, 85, 247, 0.5); z-index: 9999; }
        .boss-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        .btn-gold { background: linear-gradient(180deg, var(--accent) 0%, #BA8B02 100%); color: #000; font-weight: 900; text-transform: uppercase; border-radius: 12px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { color: var(--gray); font-size: 8px; font-weight: 800; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 50000; display: none; align-items: center; justify-content: center; padding: 20px; }
        input { background: #111; border: 1px solid var(--border); padding: 16px; border-radius: 14px; color: #fff; width: 100%; text-align: center; }
    </style>
</head>
<body>
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-purple-600 text-white px-6 py-2 rounded-full font-black text-[10px] z-[60000] hidden uppercase"></div>

    <!-- МОДАЛКА ОПЛАТЫ -->
    <div id="m-pay" class="modal">
        <div class="boss-card w-full max-w-sm p-8 text-center">
            <h2 id="p-name" class="text-yellow-500 font-black uppercase text-xl mb-6"></h2>
                        <div class="bg-white/5 p-5 rounded-2xl text-left mb-6">
                <p class="text-[8px] opacity-40 font-black mb-1">Т-БАНК / СБП</p>
                <p class="font-bold text-yellow-500 text-sm">+7 950 170 07 87</p>
            </div>
            <p id="p-total" class="text-4xl font-black mb-8">0.00 ₽</p>
            <div class="flex gap-3">
                <button onclick="closePay()" class="w-1/3 text-[9px] font-black opacity-30">Назад</button>
                <button onclick="processPurchase()" class="w-2/3 btn-gold py-4 text-[10px]">Я оплатил(а)</button>
            </div>
        </div>
    </div>

    <main id="app" class="px-4 pt-10"></main>
    <nav class="nav-bar" id="bottom-nav"></nav>

    <script>
        const tg = window.Telegram.WebApp;
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co';
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C';
        const BOT_TOKEN = '8780961369:AAHsqP2Fi4N1swLkpe2Jxn74fvv4qitJLM';
        const ADMIN_ID = '7727345054'; 

        const sb = supabase.createClient(SB_URL, SB_KEY);
        // Используем ID пользователя из Telegram, если доступен, иначе ID администратора
        const user = tg.initDataUnsafe?.user || { id: ADMIN_ID, username: 'admin' }; 
        
        let activeDiscount = 0; 
        let activeItem = null;

        // Промокоды хранятся локально
        const PROMO_CODES = { 
            "VLASTELIN2": { discount: 2, stock: 100 }, // Скидка 2%, 100 использований
            "VAEL777": { discount: 4, stock: 100 }  // Скидка 4%, 100 использований
        };

        // Функция для получения статистики пользователя из localStorage
        function getStats() {
            let s = localStorage.getItem('stats_' + user.id);
            if(!s) {
                // Если статистики нет, создаем новую
                s = { spent: 0, history: [], reg: new Date().toLocaleDateString('ru-RU'), usedPromo: [] }; 
                localStorage.setItem('stats_' + user.id, JSON.stringify(s));
            } else s = JSON.parse(s);
            return s;
        }

        // Основная функция отрисовки страниц
        async function render(page) {
            const app = document.getElementById('app');
            renderNav(page); // Отрисовываем навигацию
            app.innerHTML = `<div class="mt-20 text-center opacity-20 font-black">ЗАГРУЗКА...</div>`;

            if(page === 'shop') { // --- СТРАНИЦА МАГАЗИНА ---
                console.log("Rendering shop...");
                const { data: prods, error } = await sb.from('products').select('*').order('price');
                if (error) {
                    console.error("Error fetching products:", error);
                    alert("ОШИБКА SUPABASE при загрузке товаров: " + error.message + "\n**ПРИЧИНА:** Убедись, что RLS Policies (SELECT) для таблицы 'products' настроены правильно, и что ты авторизован!");
                    app.innerHTML = `<div class="mt-20 text-center text-red-500 font-black">ОШИБКА ЗАГРУЗКИ ТОВАРОВ</div>`;
                    return;
                }
                console.log("Products fetched:", prods);
                app.innerHTML = `<h1 class="text-center text-yellow-500 font-black text-xl mb-6">NMPRODA PREMIUM</h1>
                <div class="grid grid-cols-2 gap-4 pb-10">
                    ${(prods || []).map(p => {
                        // Применяем скидку, если она активна
                        let pr = p.price * (1 - activeDiscount/100);
                        // Отображаем stock, или 0 если null/undefined
                        const displayStock = p.stock ?? 0; 
                        return `<div class="boss-card flex flex-col h-full">
                            <img src="${p.image_url}" class="w-full aspect-square object-cover">
                            <div class="p-4 flex-1 flex flex-col justify-between">
                                <div><h3 class="text-[9px] font-black uppercase truncate">${p.name}</h3>
                                <div class="flex justify-between items-end mt-3">
                                    <p class="text-sm font-black italic ${activeDiscount > 0 ? 'text-purple-400' : ''}">${pr.toFixed(2)} ₽</p>
                                    <span class="text-[8px] font-black opacity-30">${displayStock} PCS</span>
                                </div></div>
                                <button onclick="openPay('${p.name}', ${pr})" class="btn-gold w-full py-3 text-[10px] mt-4">ШОП</button>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            }

            if(page === 'promo') { // --- СТРАНИЦА ПРОМОКОДОВ ---
                console.log("Rendering promo page...");
                const s = getStats(); // Получаем статистику пользователя
                app.innerHTML = `<h1 class="text-center text-yellow-500 font-black text-lg mb-8 uppercase">Активация промо</h1>
                <input id="v-code" placeholder="ВВЕДИТЕ КОД" class="w-full mb-4">
                <button onclick="applyV()" class="btn-gold w-full py-5 text-xs mb-10">АКТИВИРОВАТЬ</button>
                <div class="space-y-3">
                    ${Object.entries(PROMO_CODES).map(([code, data]) => {
                        // Проверяем, использовал ли пользователь этот код
                        const usedEntry = s.usedPromo.find(uc => uc.code === code);
                        // Сколько доступных использований осталось для этого пользователя
                        const remainingUses = usedEntry ? 0 : data.stock; 
                        const isAlreadyUsed = !!usedEntry; // true, если использован
                        const isOutOfStock = remainingUses <= 0; // true, если закончился

                        return `
                        <div onclick="${!isAlreadyUsed && !isOutOfStock ? `copyCode('${code}')` : ''}" class="boss-card p-5 flex justify-between items-center ${!isAlreadyUsed && !isOutOfStock ? 'cursor-pointer active:scale-95 transition' : 'opacity-50'}">
                            <div><b class="text-yellow-500 text-sm">${code}</b><p class="text-[8px] font-black opacity-40 uppercase">Скидка ${data.discount}%</p></div>
                            <span class="text-[10px] font-black">${isAlreadyUsed ? '0' : remainingUses} ОСТАЛОСЬ</span>
                        </div>`;
                    }).join('')}
                </div>`;
            }

            if(page === 'admin') { // --- АДМИН-ПАНЕЛЬ ---
                console.log("Rendering admin panel...");
                // Проверяем, является ли текущий пользователь администратором
                if (user.id.toString() !== ADMIN_ID.toString()) {
                    console.log("Access denied for user:", user.id);
                    app.innerHTML = `<div class="mt-20 text-center text-red-500 font-black">ДОСТУП ЗАПРЕЩЕН</div>`;
                    return;
                }

                // Загружаем список товаров для админки
                const { data: prds, error } = await sb.from('products').select('*');
                if (error) {
                    console.error("Error fetching products for admin:", error);
                    alert("ОШИБКА SUPABASE при загрузке товаров в админку: " + error.message + "\n**ПРИЧИНА:** Убедись, что RLS Policies (SELECT) для таблицы 'products' настроены правильно!");
                    app.innerHTML = `<div class="mt-20 text-center text-red-500 font-black">ОШИБКА ЗАГРУЗКИ ТОВАРОВ В АДМИНКЕ</div>`;
                    return;
                }
                console.log("Products for admin:", prds);
                app.innerHTML = `<h1 class="text-center text-yellow-500 font-black text-lg mb-8 uppercase">Управление стоком</h1>
                <div class="space-y-3">
                    ${prds.map(p => `
                    <div class="boss-card p-4 flex justify-between items-center">
                        <span class="text-[10px] font-black w-1/2 truncate">${p.name}</span>
                        <input type="number" id="st-${p.id}" value="${p.stock ?? 0}" class="w-16 p-2 rounded text-sm">
                        <button onclick="updateStock(${p.id})" class="btn-gold px-3 py-2 text-[10px]">SAVE</button>
                    </div>`).join('')}
                </div>`;
            }
        }

        // Функция отрисовки нижней навигации
        function renderNav(active) {
            const nav = document.getElementById('bottom-nav');
            // Основные пункты навигации
            const items = [
                {id:'shop', n:'ШОП', i:'🛒'}, {id:'status', n:'СТАТУС', i:'👤'}, 
                {id:'promo', n:'ПРОМО', i:'🔑'}
            ];
            // Добавляем админ-пункт, только если пользователь - админ
            if(user.id.toString() === ADMIN_ID.toString()) {
                 items.push({id:'admin', n:'АДМИН', i:'⚙️'});
            }
            nav.innerHTML = items.map(it => `<div onclick="render('${it.id}')" class="nav-item ${active===it.id?'active':''}"><span>${it.i}</span><span>${it.n}</span></div>`).join('');
        }

        // Функция обновления стока товара (вызывается из админки)
        async function updateStock(id) {
            const inputElement = document.getElementById('st-'+id);
            const val = inputElement.value;
            console.log(`Updating stock for product ID ${id} to ${val}`);

            // Проверка, что введено число
            if (isNaN(parseInt(val))) {
                showToast("Введите число!");
                return;
            }

            const { error } = await sb.from('products').update({ stock: parseInt(val) }).eq('id', id);
            if (error) {
                console.error("Error updating stock:", error);
                alert("ОШИБКА SUPABASE при обновлении стока: " + error.message + "\n**ПРИЧИНА:** Скорее всего, RLS Policies (UPDATE) для таблицы 'products' не настроены!");
            } else {
                showToast("СОХРАНЕНО!");
                render('shop'); // Обновляем магазин, чтобы изменения сразу отобразились
                render('admin'); // Обновляем админку, чтобы поля ввода показали актуальные данные
            }
        }

        // Функция копирования промокода
        function copyCode(c) {
            const el = document.createElement('textarea'); 
            el.value = c; 
            document.body.appendChild(el); 
            el.select();
            document.execCommand('copy'); 
            document.body.removeChild(el);
            showToast("СКОПИРОВАНО: " + c);
        }

        // Функция активации промокода
        function applyV() {
            const codeInput = document.getElementById('v-code').value.trim().toUpperCase();
            const s = getStats(); // Получаем текущую статистику пользователя
            
            console.log("Applying promo code:", codeInput);

            // Проверяем, существует ли такой промокод
            if (!PROMO_CODES[codeInput]) {
                showToast("НЕВЕРНЫЙ КОД");
                return;
            }

            const promoData = PROMO_CODES[codeInput];
            // Ищем, использовал ли пользователь этот промокод ранее
            const usedEntry = s.usedPromo.find(uc => uc.code === codeInput);

            // Если код уже был использован
            if (usedEntry) {
                showToast("ПРОМОКОД УЖЕ ИСПОЛЬЗОВАН");
                return;
            }
            
            // Если промокод новый для пользователя
            activeDiscount = promoData.discount; // Устанавливаем активную скидку
            s.usedPromo.push({ code: codeInput, discount: promoData.discount }); // Добавляем код в список использованных
            localStorage.setItem('stats_' + user.id, JSON.stringify(s)); // Сохраняем измененную статистику
            
            document.body.classList.add('promo-active'); // Добавляем класс для фиолетового свечения
            showToast("СКИДКА " + activeDiscount + "% АКТИВИРОВАНА!"); 
            render('shop'); // Перерисовываем магазин, чтобы применить скидку
            render('promo'); // Перерисовываем страницу промо, чтобы обновить информацию
        }

        // Открытие модалки оплаты
        function openPay(n, p) { 
            activeItem = {n, p}; // Сохраняем название и цену товара
            document.getElementById('p-name').innerText = n; 
            document.getElementById('p-total').innerText = p.toFixed(2) + ' ₽'; 
            document.getElementById('m-pay').style.display = 'flex'; // Показываем модалку
        }
        // Закрытие модалки оплаты
        function closePay() { document.getElementById('m-pay').style.display = 'none'; }

        // Обработка покупки после нажатия "Я оплатил(а)"
        async function processPurchase() {
            console.log("Processing purchase for:", activeItem.n);
            
            // 1. Проверяем наличие stock в таблице products
            const { data: prod, error: e1 } = await sb.from('products').select('stock').eq('name', activeItem.n).single();
            if(e1) {
                console.error("Supabase Error (SELECT products stock):", e1);
                alert("ОШИБКА SUPABASE при проверке stock: " + e1.message + "\n**ПРИЧИНА:** Убедись, что RLS Policies (SELECT) для таблицы 'products' настроены, и название товара '" + activeItem.n + "' совпадает ТОЧНО!");
                return;
            }
            if(!prod) {
                alert("ОШИБКА: Товар '" + activeItem.n + "' не найден в таблице products. Проверь ТОЧНОЕ совпадение имени (включая флаги и пробелы)!");
                return;
            }
            // Проверяем, есть ли товар в наличии (stock > 0)
            if((prod.stock ?? 0) <= 0) { 
                alert("ОШИБКА: Для товара '" + activeItem.n + "' в таблице products stock = 0. Увеличь stock в админке или Supabase.");
                return;
            }

            // 2. Ищем свободные данные аккаунта в таблице accounts_data
            const { data: acc, error: e2 } = await sb.from('accounts_data')
                .select('*')
                .eq('product_name', activeItem.n) // Ищем по названию товара
                .eq('is_sold', false) // Ищем только непроданные
                .limit(1).single(); // Берем только одну запись

            if(e2) {
                console.error("Supabase Error (SELECT accounts_data):", e2);
                alert("ОШИБКА SUPABASE при поиске аккаунта: " + e2.message + "\n**ПРИЧИНА:** Убедись, что RLS Policies (SELECT) для таблицы 'accounts_data' настроены, и название товара '" + activeItem.n + "' совпадает ТОЧНО!");
                return;
            }
            if(!acc) {
                alert("ОШИБКА: В таблице accounts_data нет свободных данных для '" + activeItem.n + "'. \n**ПРИЧИНА:** Проверь ТОЧНОЕ совпадение 'product_name' с именем товара, и что 'is_sold' = false!");
                return;
            }

            // Если все проверки пройдены - выдаем аккаунт
            showToast("Товар найден. Отправляю аккаунт в Telegram.");
            console.log("Account found:", acc);
            // 3. Помечаем аккаунт как проданный
            const { error: updateAccError } = await sb.from('accounts_data').update({ is_sold: true }).eq('id', acc.id);
            if (updateAccError) {
                console.error("Supabase Error (UPDATE accounts_data):", updateAccError);
                alert("ОШИБКА SUPABASE при обновлении статуса аккаунта: " + updateAccError.message + "\n**ПРИЧИНА:** Скорее всего, RLS Policies (UPDATE) для 'accounts_data' не настроены!");
                return;
            }

            // 4. Уменьшаем stock товара
            const { error: updateProdError } = await sb.from('products').update({ stock: prod.stock - 1 }).eq('id', prod.id);
            if (updateProdError) {
                console.error("Supabase Error (UPDATE products stock):", updateProdError);
                alert("ОШИБКА SUPABASE при уменьшении stock: " + updateProdError.message + "\n**ПРИЧИНА:** Скорее всего, RLS Policies (UPDATE) для 'products' не настроены!");
                return;
            }

            // 5. Отправляем данные аккаунта пользователю через Telegram Bot
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({chat_id:user.id, text:`✅ ТВОЙ АККАУНТ ${activeItem.n}:\n\n${acc.data}`})
            });

            closePay(); // Закрываем модалку оплаты
            render('shop'); // Обновляем магазин, чтобы показать новый stock
        }

        // Функция для показа коротких уведомлений (тостов)
        function showToast(t) { 
            const s = document.getElementById('toast'); 
            s.innerText = t; 
            s.classList.remove('hidden'); 
            // Анимация скрытия через 3 секунды
            setTimeout(() => s.classList.add('hidden'), 3000); 
        }

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => { 
            tg.ready(); // Говорим Telegram, что мини-приложение готово
            tg.expand(); // Расширяем мини-приложение на весь экран
            render('shop'); // Отрисовываем главную страницу (магазин)
        });
    </script>
</body>
</html>
