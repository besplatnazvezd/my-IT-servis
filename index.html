<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS STORE | PREMIUM DIGITAL SERVICE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #030303; --card: rgba(20, 20, 20, 0.8); }
        body { background-color: var(--bg); color: white; font-family: 'Inter', sans-serif; }
        .boss-title { font-family: 'Syncopate', sans-serif; letter-spacing: -2px; }
        
        /* Эффект свечения для карточек */
        .premium-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .premium-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
            transform: translateY(-5px);
        }

        /* Анимированный фон */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% -20%, #1e3a8a 0%, transparent 50%);
            z-index: -1; pointer-events: none;
        }

        .nav-active { color: var(--accent); position: relative; }
        .nav-active::after {
            content: ''; position: absolute; bottom: -10px; left: 0; width: 100%; height: 2px;
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
        }

        /* Кнопки */
        .btn-boss {
            background: linear-gradient(90deg, #1d4ed8, #3b82f6);
            text-transform: uppercase; font-weight: 900; letter-spacing: 1px;
            transition: 0.3s;
        }
        .btn-boss:hover { filter: brightness(1.2); transform: scale(1.02); }

        input, textarea {
            background: rgba(255,255,255,0.03) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: white !important;
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="bg-glow"></div>

    <!-- НАВИГАЦИЯ -->
        <nav class="sticky top-0 z-[100] bg-black/60 backdrop-blur-lg border-b border-white/5 p-5">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="boss-title text-2xl font-bold text-white">BOSS<span class="text-blue-500">STORE</span></div>
            <div class="hidden md:flex gap-8 text-[11px] font-black uppercase tracking-widest opacity-60">
                <button onclick="switchTab('shop')" id="n-shop" class="nav-active">Магазин</button>
                <button onclick="switchTab('news')" id="n-news">Статьи</button>
                <button onclick="switchTab('reviews')" id="n-reviews">Отзывы</button>
                <button onclick="switchTab('profile')" id="n-profile">Профиль</button>
            </div>
            <div id="user-status" onclick="switchTab('profile')" class="cursor-pointer bg-blue-500/10 border border-blue-500/20 px-4 py-2 rounded-full text-[10px] font-bold text-blue-400 uppercase">
                Войти
            </div>
        </div>
    </nav>

    <!-- ТАБ: МАГАЗИН -->
    <section id="tab-shop" class="tab-content max-w-6xl mx-auto p-6 mt-10">
        <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
            <h1 class="boss-title text-5xl md:text-7xl uppercase italic">Exclusive<br><span class="text-blue-500">Access</span></h1>
            <input type="text" id="search" oninput="searchItems()" placeholder="Поиск товара..." class="w-full md:w-80 p-4 rounded-2xl outline-none focus:border-blue-500">
        </div>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="col-span-full text-center opacity-20 py-20 italic">Синхронизация с базой BOSS...</div>
        </div>
    </section>

    <!-- ТАБ: СТАТЬИ -->
    <section id="tab-news" class="tab-content hidden max-w-4xl mx-auto p-6 mt-10">
        <h2 class="boss-title text-4xl mb-10">Inside<br><span class="text-blue-500">Boss Mind</span></h2>
        <div id="news-grid" class="grid gap-8">
            <div class="opacity-20 italic text-center py-20">Статей пока нет...</div>
        </div>
    </section>

    <!-- ТАБ: ОТЗЫВЫ -->
        <section id="tab-reviews" class="tab-content hidden max-w-4xl mx-auto p-6 mt-10">
        <div class="flex justify-between items-center mb-10">
            <h2 class="boss-title text-4xl">Client<br><span class="text-blue-500">Feedback</span></h2>
            <button onclick="openModal('modal-review')" class="btn-boss px-6 py-3 rounded-xl text-[10px]">Оставить отзыв</button>
        </div>
        <div id="reviews-grid" class="grid gap-4"></div>
    </section>

    <!-- ТАБ: ПРОФИЛЬ -->
    <section id="tab-profile" class="tab-content hidden max-w-2xl mx-auto p-6 mt-10">
        <div id="auth-form" class="premium-card p-10 rounded-[40px] text-center border-blue-500/20">
            <h2 class="boss-title text-3xl mb-8 uppercase italic text-blue-500">Private Terminal</h2>
            <div class="space-y-4">
                <input id="email" type="email" placeholder="Email" class="w-full p-4 rounded-xl outline-none">
                <input id="password" type="password" placeholder="Пароль" class="w-full p-4 rounded-xl outline-none">
                <button onclick="handleAuth('login')" class="w-full btn-boss p-5 rounded-xl text-sm">Авторизация</button>
                <button onclick="handleAuth('signup')" class="opacity-30 text-[10px] font-bold uppercase mt-4">Создать новый аккаунт</button>
            </div>
        </div>
        <div id="profile-data" class="hidden">
            <div class="premium-card p-10 rounded-[40px] mb-6">
               <p class="text-[10px] uppercase font-black opacity-40 mb-2">Boss Balance</p>
                <h3 id="balance-val" class="text-6xl font-black italic text-blue-500 mb-8">0 ₽</h3>
                <button onclick="openModal('modal-voucher')" class="btn-boss px-8 py-4 rounded-xl text-[10px]">Пополнить ваучером</button>
            </div>
            <h4 class="boss-title text-sm mb-4 opacity-40">История транзакций</h4>
            <div id="orders-list" class="space-y-2 opacity-30 italic text-xs">Заказов пока нет.</div>
            <button onclick="sb.auth.signOut().then(()=>location.reload())" class="mt-10 text-red-500 text-[10px] font-bold uppercase underline">Выйти из системы</button>
        </div>
    </section>

    <!-- ВСЕ МОДАЛЬНЫЕ ОКНА (ТЕПЕРЬ ОНИ ТУТ И БУДУТ РАБОТАТЬ) -->
    
    <!-- Модалка ваучера -->
    <div id="modal-voucher" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden items-center justify-center z-[200] p-6">
        <div class="premium-card p-10 rounded-[40px] w-full max-w-sm text-center">
            <h2 class="boss-title text-2xl mb-6">Activate<br>Voucher</h2>
            <input id="v-code" type="text" placeholder="XXXX-XXXX" class="w-full p-5 rounded-2xl mb-6 text-center font-mono text-xl uppercase italic">
            <button onclick="activateVoucher()" class="w-full btn-boss p-5 rounded-2xl">Пополнить</button>
            <button onclick="closeModal('modal-voucher')" class="mt-4 opacity-30 text-[10px] font-bold uppercase">Отмена</button>
        </div>
    </div>

    <!-- Модалка отзыва -->
    <div id="modal-review" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden items-center justify-center z-[200] p-6">
        <div class="premium-card p-10 rounded-[40px] w-full max-w-md text-center">
            <h2 class="boss-title text-2xl mb-6">Write<br>Review</h2>
            <textarea id="r-text" placeholder="Ваше мнение..." class="w-full p-4 rounded-2xl h-32 mb-4 outline-none"></textarea>
            <button onclick="sendReview()" class="w-full btn-boss p-5 rounded-2xl">Опубликовать</button>
            <button onclick="closeModal('modal-review')" class="mt-4 opacity-30 text-[10px] font-bold uppercase">Отмена</button>
        </div>
    </div>

    <!-- Модалка Успеха (Выдача товара) -->
    <div id="modal-success" class="fixed inset-0 bg-black/95 backdrop-blur-3xl hidden items-center justify-center z-[300] p-6">
        <div class="text-center max-w-md">
            <div class="text-8xl mb-6">💎</div>
            <h2 class="boss-title text-3xl mb-4">ACCEPTED</h2>
            <p class="text-gray-400 text-sm mb-8 italic">Данные отправлены вам в Telegram и отображены ниже:</p>
            <div id="acc-output" class="premium-card p-8 rounded-[30px] font-mono text-blue-400 text-xl break-all mb-8 shadow-2xl shadow-blue-500/20"></div>
            <div class="flex flex-col gap-4">
                <button id="btn-gift" class="w-full bg-purple-600 p-5 rounded-2xl font-black text-xs uppercase italic tracking-widest shadow-xl shadow-purple-500/20">Отправить как подарок 🚀</button>
                <button onclick="closeModal('modal-success')" class="btn-boss p-5 rounded-2xl text-[10px]">Вернуться в BOSS STORE</button>
            </div>
        </div>
    </div>

    <script>
        // ДАННЫЕ (ВСТАВЬ СВОИ)
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co'.trim();
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C'.trim();
        const TG_TOKEN = '8780961369:AAHsQp2Fi4N1swxLkpE2Jxn74fvv4qitJLM'.trim();
        const TG_CHAT_ID = '7727345054'.trim();
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let products = [];

        // НАВИГАЦИЯ
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.hidden.md\\:flex button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`n-${tab}`).classList.add('nav-active');
            if(tab === 'reviews') loadReviews();
            if(tab === 'shop') loadProducts();
        }

        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        // ЗАГРУЗКА ТОВАРОВ
        async function loadProducts() {
            const { data } = await sb.from('products').select('*');
            products = data || [];
            renderProducts(products);
        }

        function renderProducts(list) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = list.map(p => `
                <div class="premium-card p-8 rounded-[40px] flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-[8px] font-black uppercase tracking-widest text-blue-500 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">Boss Exclusive</span>
                            <span class="text-2xl font-black italic">${p.price} ₽</span>
                        </div>
                        <h3 class="boss-title text-xl mb-2 italic">${p.name}</h3>
                        <p class="text-[10px] opacity-40 uppercase font-bold tracking-widest mb-10">${p.description}</p>
                    </div>
                    <button onclick="buyItem('${p.name}', ${p.price})" class="btn-boss w-full py-5 rounded-2xl text-[11px]">Get Access</button>
                </div>
            `).join('');
        }

        // ПОКУПКА
        async function buyItem(name, price) {
            const { data: { user } } = await sb.auth.getUser();
            if(!user) return switchTab('profile');

            const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
            if(!prof || prof.balance < price) return alert("Пополните баланс BOSS!");

            const { data: acc } = await sb.from('accounts_data').select('*').eq('product_name', name).eq('is_sold', false).limit(1).single();
            if(!acc) return alert("Товар закончился!");

            await sb.from('profiles').update({ balance: prof.balance - price }).eq('id', user.id);
            await sb.from('accounts_data').update({ is_sold: true }).eq('id', acc.id);

            // Выдача
            document.getElementById('acc-output').innerText = acc.data;
            document.getElementById('btn-gift').onclick = () => createGift(acc.data);
            openModal('modal-success');

            // БОТ ТЕЛЕГРАМ
            const msg = `💎 BOSS STORE: НОВАЯ ПРОДАЖА\n\nТовар: ${name}\nДанные: ${acc.data}\nЮзер: ${user.email}`;
            fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(msg)}`);
            
            updateUserUI();
        }

        // ВАУЧЕРЫ
        async function activateVoucher() {
            const code = document.getElementById('v-code').value.trim();
            const { data: { user } } = await sb.auth.getUser();
            const { data: v } = await sb.from('vouchers').select('*').eq('code', code).eq('is_used', false).single();
            
            if(!v) return alert("Ваучер недействителен");
            const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
            await sb.from('profiles').update({ balance: (prof.balance || 0) + v.value }).eq('id', user.id);
            await sb.from('vouchers').update({ is_used: true }).eq('id', v.id);

            alert(`Зачислено ${v.value} ₽!`);
            closeModal('modal-voucher');
            updateUserUI();
        }

        // АВТОРИЗАЦИЯ
        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = type === 'login' 
                ? await sb.auth.signInWithPassword({ email, password })
                : await sb.auth.signUp({ email, password });
            if(error) alert(error.message); else location.reload();
        }

        async function updateUserUI() {
            const { data: { user } } = await sb.auth.getUser();
            if(user) {
                const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('profile-data').classList.remove('hidden');
                document.getElementById('balance-val').innerText = `${prof?.balance || 0} ₽`;
                document.getElementById('user-status').innerText = user.email.split('@')[0];
            }
        }

        async function createGift(data) {
            const giftId = crypto.randomUUID();
            await sb.from('gifts').insert([{ id: giftId, data: data, is_opened: false }]);
            prompt("Ссылка-подарок готова! Скопируй:", `${window.location.origin}/gift.html?id=${giftId}`);
        }

        loadProducts();
        updateUserUI();
    </script>
</body>
</html>
