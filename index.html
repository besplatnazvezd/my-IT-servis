<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NMPRODA PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --bg: #000; --card: #0d0d0d; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: #fff; margin: 0; padding-bottom: 110px; overflow-x: hidden; }
        .boss-card { background: var(--card); border-radius: 24px; border: 1px solid rgba(255, 215, 0, 0.1); }
        .btn-gold { background: linear-gradient(180deg, #FFD700 0%, #BA8B02 100%); color: #000; font-weight: 900; text-transform: uppercase; border-radius: 14px; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: rgba(5,5,5,0.98); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,215,0,0.1); padding: 12px 0; display: flex; justify-content: space-around; z-index: 10000; }
        .nav-item { color: #444; font-size: 8px; font-weight: 800; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
        .nav-item.active { color: var(--gold); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 50000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        /* Стили для инпутов, если не было */
        input { background: #1a1b22 !important; border: 1px solid rgba(255,255,255,0.05) !important; border-radius: 12px; padding: 14px; color: #fff; width: 100%; outline: none; font-size: 13px; }
    </style>
</head>
<body>

    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-2 rounded-full font-black text-[10px] z-[60000] hidden uppercase"></div>

    <!-- МОДАЛКА ОПЛАТЫ -->
    <div id="m-pay" class="modal hidden">
        <div class="boss-card w-full max-w-sm p-8 text-center">
            <h2 id="p-name" class="text-yellow-500 font-black uppercase text-xl mb-6 italic"></h2>
            <div class="bg-[#1a1b22] p-4 rounded-xl border border-white/5 text-left mb-6">
                                <p class="text-[8px] opacity-40 font-black uppercase mb-1">Т-Банк / СБП</p>
                <p class="font-bold text-yellow-500 text-sm italic">+7 950 170 07 87</p>
            </div>
            <p id="p-total" class="text-3xl font-black text-white mb-8 italic"></p>
            <div class="flex gap-4">
                <button onclick="document.getElementById('m-pay').classList.add('hidden')" class="w-1/3 text-[10px] font-bold opacity-30 uppercase">Назад</button>
                <button onclick="processOrder()" class="w-2/3 btn-gold py-4 text-[10px]">Я оплатил(а)</button>
            </div>
        </div>
    </div>

    <main id="app" class="px-4 pt-6"></main>

    <nav class="nav-bar">
        <div onclick="render('shop')" id="n-shop" class="nav-item active">🛒<span>Шоп</span></div>
        <div onclick="render('info')" id="n-info" class="nav-item">📖<span>Инфо</span></div>
        <div onclick="render('reviews')" id="n-reviews" class="nav-item">⭐<span>Отзывы</span></div>
        <div onclick="render('status')" id="n-status" class="nav-item">👤<span>Статус</span></div>
        <div onclick="render('promo')" id="n-promo" class="nav-item">🎫<span>Ваучер</span></div>
        <!-- Кнопка админа появится только у тебя, если ты ее добавляла в прошлом ответе -->
        <div id="nav-admin" onclick="render('admin')" class="nav-item hidden">⚙️<span>Админ</span></div>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co'; 
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C';
        const BOT_TOKEN = '8730430332:AAGff_PCX2059o3EUwG-d9C19uTqcH4sAZ4'; // Твой токен бота
        const ADMIN_ID = '7727345054'; // Твой Telegram ID как админа (число в виде строки)

        const sb = supabase.createClient(SB_URL, SB_KEY);
        let products = [], activeItem = null;
        let userVoucher = 0; // Величина скидки по ваучеру

        // Инициализация tgUser: если Telegram WebApp не дал данные, используем заглушки.
        // Это важно, чтобы tgUser.id всегда был доступен.
        const tgUser = tg.initDataUnsafe?.user || { id: '0000000000', username: 'guest' };

        // Функция для форматирования даты
        function formatDate(dateString) {
                        const date = new Date(dateString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0'); // Месяцы от 0 до 11
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        async function render(page) {
            const app = document.getElementById('app');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            // Если есть кнопка админа, выбираем ее, иначе стандартную
            const navBtn = document.getElementById('n-' + page) || document.getElementById('nav-admin');
            if (navBtn) navBtn.classList.add('active');
            app.innerHTML = '';

            // Показываем кнопку админа если ID совпадает
            if(tgUser.id.toString() === ADMIN_ID.toString()) { // Важно сравнивать как строки
                const adminNavBtn = document.getElementById('nav-admin');
                if (adminNavBtn) adminNavBtn.classList.remove('hidden');
            }

            if (page === 'shop') {
                app.innerHTML = `<h1 class="text-xl font-black italic text-yellow-500 uppercase text-center mb-6 tracking-tighter">BOSS STORE</h1><div id="grid" class="grid grid-cols-2 gap-4"></div>`;
                const { data } = await sb.from('products').select('*').order('name');
                products = data || [];
                document.getElementById('grid').innerHTML = products.map(p => {
                    const finalPrice = Math.max(0, p.price - userVoucher);
                    const isOutOfStock = p.stock <= 0;
                    return `
                    <div class="boss-card flex flex-col relative">
                        ${isOutOfStock ? '<div class="absolute inset-0 bg-black/60 z-20 flex items-center justify-center p-4 text-center text-[8px] font-black uppercase text-yellow-500">НЕТ В НАЛИЧИИ</div>' : ''}
                        <img src="${p.image_url}" class="w-full aspect-square object-cover opacity-80">
                        <div class="p-4">
                            <h3 class="text-[9px] font-black text-white uppercase mb-1">${p.name}</h3>
                            <div class="flex items-baseline gap-2">
                                <p class="text-sm font-black text-yellow-500 italic">${finalPrice}.00 ₽</p>
                                ${userVoucher > 0 ? `<p class="text-[8px] line-through opacity-30">${p.price} ₽</p>` : ''}
                            </div>
                            <button onclick="openBuy('${p.id}')" class="btn-gold w-full py-3 text-[10px] mt-3 ${isOutOfStock ? 'opacity-50 grayscale cursor-not-allowed' : ''}" ${isOutOfStock ? 'disabled' : ''}>ШОП</button>
                        </div>
                    </div>`;
                }).join('');
            } 
            else if (page === 'info') {
                app.innerHTML = `<h2 class="text-yellow-500 font-black text-center text-xl mb-8 uppercase italic">ИНФО</h2>
                    <div class="boss-card p-6 border-white/5"><p class="text-[11px] opacity-60 leading-relaxed italic">Добро пожаловать в BOSS STORE. Ниже вы найдете инструкцию по работе с нашими аккаунтами.</p>
                    <a href="https://instructions-nine.vercel.app/" class="block mt-6 text-yellow-500 font-black text-[11px] uppercase border-b border-yellow-500 w-fit pb-1">Читать полную инструкцию</a></div>`;
            }
            else if (page === 'status') {
                // ПОЛУЧАЕМ ДАННЫЕ О ДАТЕ РЕГИСТРАЦИИ ИЗ СУПАБЕЙС
                const { data: prof, error: profError } = await sb.from('profiles').select('*').eq('id', tgUser.id.toString()).single(); // ID юзера из TGWebApp
                
                let regDate = new Date().toLocaleDateString(); // По умолчанию - текущая дата
                let totalSpent = 0;

                if (prof) {
                    regDate = formatDate(prof.created_at);
                    totalSpent = prof.total_spent || 0;
                } else if (profError && profError.code === 'PGRST116') { // Если профиль не найден, создаем его
                    await sb.from('profiles').insert({ id: tgUser.id.toString(), username: tgUser.username, created_at: new Date().toISOString(), total_spent: 0 });
                    regDate = new Date().toLocaleDateString();
                } else if (profError) {
                    console.error("Error fetching profile:", profError);
                }

                const progress = (totalSpent / 100000) * 100;

                app.innerHTML = `
                <div class="boss-card p-6">
                    <h2 class="text-yellow-500 font-black text-[10px] uppercase mb-10 italic">BOSS VIP STATUS</h2>
                    <div class="mb-10">
                        <div class="flex justify-between text-[7px] font-black uppercase opacity-40 mb-2">
                            <span>Progress to 100k</span>
                            <span>${totalSpent.toFixed(2)} / 100 000.00 ₽</span>
                        </div>
                        <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                            <div class="h-full bg-yellow-500" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-y-8 mb-12">
                        <div><p class="text-[8px] opacity-30 font-black uppercase mb-1">ID КЛИЕНТА</p><p class="text-[10px] font-black">${tgUser.id}</p></div>
                        <div><p class="text-[8px] opacity-30 font-black uppercase mb-1">ЮЗЕР</p><p class="text-[10px] font-black">@${tgUser.username || 'unknown'}</p></div>
                        <div><p class="text-[8px] opacity-30 font-black uppercase mb-1">СКИДКА</p><p class="text-yellow-500 font-black text-[10px]">${userVoucher} %</p></div>
                        <div><p class="text-[8px] opacity-30 font-black uppercase mb-1">РЕГ</p><p class="text-[10px] font-black">${regDate}</p></div>
                    </div>
                    <p class="text-[8px] opacity-30 font-black uppercase mb-4 italic">История покупок:</p>
                    <p class="text-[9px] font-black opacity-20 uppercase text-center py-4">Покупок нет</p>
                </div>`;
            }
            else if (page === 'reviews') {
                const { data } = await sb.from('reviews').select('*').order('created_at', {ascending: false});
                app.innerHTML = `<h2 class="text-yellow-500 font-black text-center text-xl mb-8 uppercase italic">ОТЗЫВЫ</h2>
                    <div class="space-y-4 pb-10">${(data || []).map(r => `
                    <div class="boss-card p-5"><p class="text-yellow-500 font-black text-[8px] uppercase mb-2">${r.user_email?.split('@')[0] || 'CLIENT'}</p>
                    <p class="text-[10px] italic opacity-70">${r.text}</p></div>`).join('')}</div>`;
            }
            else if (page === 'promo') {
                app.innerHTML = `<h2 class="text-yellow-500 font-black text-center text-xl mb-8 uppercase italic">ВАУЧЕР</h2>
                    <div class="pt-4"><input id="v-in" placeholder="ВВЕДИТЕ КОД" class="mb-4">
                    <button onclick="applyVoucher()" class="btn-gold w-full py-4 text-[11px]">АКТИВИРОВАТЬ</button></div>`;
            }
            // Если ты хочешь админку в index.html, убедись, что ее логика здесь присутствует
            // и кнопка nav-admin видима при tgUser.id === ADMIN_ID
            else if (page === 'admin' && tgUser.id.toString() === ADMIN_ID.toString()) {
                // ... Ваш код админки, если она тут ...
                app.innerHTML = `<h2 class="text-red-500 font-black text-center text-xl mb-8 uppercase italic">АДМИН-ПАНЕЛЬ</h2><div class="boss-card p-6">Здесь будет ваша админ-панель.</div>`; // Заглушка
            }
        }

        // ЛОГИКА ВАУЧЕРА (МЕНЯЕТ ЦЕНУ)
        async function applyVoucher() {
            const code = document.getElementById('v-in').value.trim();
            const { data, error } = await sb.from('vouchers').select('*').eq('code', code).eq('is_used', false).single();
            
            if (error || !data) return showToast("ВАУЧЕР НЕ НАЙДЕН ИЛИ ИСПОЛЬЗОВАН");
            
            userVoucher = data.value; // Устанавливаем величину скидки
            // Опционально: можно пометить ваучер как использованный
            // await sb.from('vouchers').update({ is_used: true }).eq('id', data.id);

            showToast(`АКТИВИРОВАНО: -${data.value}₽ НА ВСЕ ТОВАРЫ`);
            render('shop'); // Сразу обновляем цены в магазине
        }

        function openBuy(id) {
            const p = products.find(x => x.id === id);
            if (!p || p.stock <= 0) return showToast("ИЗВИНИТЕ, ТАКОГО ТОВАРА НЕТ В НАЛИЧИИ");
            activeItem = p;
            const finalPrice = Math.max(0, p.price - userVoucher); // Вычисляем итоговую цену со скидкой
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-total').innerText = finalPrice + '.00 ₽';
            document.getElementById('m-pay').classList.remove('hidden');
        }

        async function processOrder() {
            const finalPrice = Math.max(0, activeItem.price - userVoucher); // Пересчитываем finalPrice
            // Тот самый текст с рабочей ссылкой и HTML-разметкой для ссылки
            const clientMsg = `Спасибо за покупку. Твой аккаунт уже ждёт тебя ⭐️. Пиши сюда @nmproda, если спамблок <a href="https://t.me/+6p6zsbaMA443YmJh">перейди в группу</a> и напиши @nmproda.`;

            try {
                // 1. Уведомление ТЕБЕ (Админу) с деталями заказа
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: ADMIN_ID, 
                        text: `🔔 НОВЫЙ ЗАКАЗ!\n\n` +
                              `🆔 ID Клиента: ${tgUser.id}\n` +
                              `👤 Юзернейм: @${tgUser.username || 'неизвестно'}\n` +
                              `📦 Товар: ${activeItem.name}\n` +
                              `🔢 Количество: 1 шт.\n` + // Предполагаем 1 штуку, т.к. нет выбора количества
                              `💰 Цена (к оплате): ${finalPrice} ₽\n\n` +
                              `🔥 ВЫДАЙТЕ АККАУНТ!` 
                    })
                });

                // 2. Отправка сообщения КЛИЕНТУ
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: tgUser.id, 
                        parse_mode: 'HTML', // Включаем HTML-парсинг для ссылки
                        text: clientMsg 
                    })
                });

                // Опционально: обновить total_spent для прогресс-бара
                const { data: currentProfile } = await sb.from('profiles').select('total_spent').eq('id', tgUser.id.toString()).single();
                if (currentProfile) {
                    await sb.from('profiles').update({ total_spent: (currentProfile.total_spent || 0) + finalPrice }).eq('id', tgUser.id.toString());
                }

                document.getElementById('m-pay').classList.add('hidden');
                showToast("ЗАКАЗ ПРИНЯТ! ПРОВЕРЬТЕ БОТА");
                render('shop'); // Обновляем шоп после заказа
            } catch (e) { 
                console.error("Ошибка при обработке заказа:", e);
                showToast("ОШИБКА ОБРАБОТКИ ЗАКАЗА"); 
            }
        }

        function showToast(t) { const s = document.getElementById('toast'); s.innerText = t; s.classList.remove('hidden'); setTimeout(()=>s.classList.add('hidden'), 3000); }
        document.addEventListener('DOMContentLoaded', () => { tg.expand(); render('shop'); });
    </script>
</body>
</html>
