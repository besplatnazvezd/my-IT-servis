<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG-STORE | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #080808; --card: #121212; --text: #ffffff; --accent: #3b82f6; }
        .light-theme { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        
        body { background: var(--bg); color: var(--text); transition: 0.3s; font-family: 'Inter', sans-serif; }
        .glass { background: var(--card); border: 1px solid rgba(128,128,128,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .input-style { background: rgba(128,128,128,0.05); border: 1px solid rgba(128,128,128,0.2); color: var(--text); }
        .btn-main { background: var(--accent); color: white; transition: 0.2s; }
        .btn-main:active { transform: scale(0.96); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="flex justify-between items-center p-5 sticky top-0 bg-inherit z-50 border-b border-white/5">
        <div class="flex items-center gap-4">
            <span class="text-xl font-black tracking-tighter text-blue-500 uppercase italic">TG-MILLIONAIRE</span>
            <button onclick="toggleTheme()" class="text-[10px] glass px-3 py-1 rounded-full border">ТЕМA</button>
        </div>
        <div id="user-info">
            <button onclick="openModal('auth-modal')" class="btn-main px-5 py-2 rounded-xl text-xs font-bold uppercase tracking-widest">Войти</button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-4">
        <h1 class="text-4xl font-black text-center my-8 italic uppercase tracking-tighter">Shop Online</h1>
        
        <input type="text" id="search" oninput="filterProducts()" placeholder="Поиск товара..." 
               class="w-full input-style p-4 rounded-2xl mb-8 outline-none focus:ring-2 ring-blue-500/50">

        <div id="products-list" class="grid gap-3">
            <div class="text-center opacity-20 py-20 italic">Загрузка витрины...</div>
        </div>
    </main>

    <!-- МОДАЛКА ВХОДА -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[100] p-4">
        <div class="glass p-8 rounded-[35px] w-full max-w-sm relative">
            <h2 class="text-2xl font-bold mb-6 text-center">КАБИНЕТ</h2>
                        <div class="space-y-3">
                <input id="email" type="email" placeholder="Email" class="w-full input-style p-4 rounded-xl outline-none">
                <input id="password" type="password" placeholder="Пароль" class="w-full input-style p-4 rounded-xl outline-none">
                <button onclick="handleAuth('login')" class="w-full btn-main p-4 rounded-xl font-bold uppercase text-sm">Войти</button>
                <button onclick="handleAuth('signup')" class="w-full border border-blue-500/30 p-4 rounded-xl font-bold uppercase text-[10px] opacity-70">Создать аккаунт</button>
                <button onclick="openModal('voucher-modal')" class="w-full text-blue-500 text-[10px] font-bold uppercase tracking-widest pt-2">У меня есть ваучер</button>
            </div>
            <button onclick="closeModal('auth-modal')" class="absolute top-6 right-6 opacity-30 text-xl">✕</button>
        </div>
    </div>

    <!-- МОДАЛКА ВАУЧЕРА -->
    <div id="voucher-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[110] p-4">
        <div class="glass p-8 rounded-[35px] w-full max-w-sm text-center">
            <h2 class="text-xl font-bold mb-4">АКТИВАЦИЯ ВАУЧЕРА</h2>
            <input id="v-code" type="text" placeholder="Введите код" class="w-full input-style p-4 rounded-xl mb-4 text-center font-mono">
            <button onclick="useVoucher()" class="w-full btn-main p-4 rounded-xl font-bold mb-4">ПОПОЛНИТЬ БАЛАНС</button>
            <button onclick="closeModal('voucher-modal')" class="text-xs opacity-40 uppercase">Назад</button>
        </div>
    </div>

    <!-- ОКНО УВЕДОМЛЕНИЙ -->
    <div id="msg-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[200] p-4">
        <div class="glass p-8 rounded-[40px] w-full max-w-xs text-center border-blue-500">
            <div id="msg-icon" class="text-5xl mb-4">✅</div>
            <div id="msg-text" class="font-medium text-sm mb-6"></div>
            <button onclick="closeModal('msg-modal')" class="w-full btn-main p-4 rounded-2xl font-bold uppercase text-xs">Принято</button>
        </div>
    </div>

    <script>
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co'.trim();
                const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C'.trim();
        const TG_BOT_TOKEN = '8780961369:AAHsQp2Fi4N1swxLkpE2Jxn74fvv4qitJLM';
        const TG_CHAT_ID = '7727345054';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let allProducts = [];

        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function openModal(id) { document.getElementById(id).classList.replace('hidden', 'flex'); }
        function closeModal(id) { document.getElementById(id).classList.replace('flex', 'hidden'); }

        function alertMsg(text, icon = '💡') {
            document.getElementById('msg-text').innerHTML = text;
            document.getElementById('msg-icon').innerText = icon;
            openModal('msg-modal');
        }

        async function loadProducts() {
            const { data, error } = await sb.from('products').select('*');
            if (error) return console.error(error);
            allProducts = data;
            render(data);
        }

        function render(items) {
            const list = document.getElementById('products-list');
            list.innerHTML = items.map(p => `
                <div class="glass p-5 rounded-2xl flex items-center justify-between hover:border-blue-500/50 transition cursor-default">
                    <div class="flex items-center gap-4">
                        <div class="text-3xl bg-blue-500/10 w-14 h-14 flex items-center justify-center rounded-2xl">📦</div>
                        <div>
                  <div class="font-bold text-base uppercase">${p.name}</div>
                            <div class="text-[10px] opacity-40 uppercase font-black">${p.description || 'Premium'}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-xl font-black text-blue-500">${p.price}₽</div>
                        <button onclick="buy('${p.name}', ${p.price})" class="btn-main px-6 py-2.5 rounded-xl text-xs font-black uppercase italic">Buy</button>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const q = document.getElementById('search').value.toLowerCase();
            render(allProducts.filter(p => p.name.toLowerCase().includes(q)));
        }

        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = type === 'login' 
                ? await sb.auth.signInWithPassword({ email, password })
                : await sb.auth.signUp({ email, password });

            if (error) alertMsg(error.message, '❌');
            else {
                if(type === 'signup') alertMsg('Успешно! Теперь войдите.', '✅');
                else location.reload();
            }
        }

        async function useVoucher() {
            const code = document.getElementById('v-code').value;
            const { data: { user } } = await sb.auth.getUser();
            if(!user) return alertMsg('Войдите в аккаунт!', '👤');

            const { data: v } = await sb.from('vouchers').select('*').eq('code', code).eq('is_used', false).single();
            if(!v) return alertMsg('Ваучер не найден!', '❌');

            const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
            await sb.from('profiles').update({ balance: (prof.balance || 0) + v.value }).eq('id', user.id);
            await sb.from('vouchers').update({ is_used: true }).eq('id', v.id);

            alertMsg(`Баланс пополнен на ${v.value}₽!`, '💰');
            closeModal('voucher-modal');
            checkUser();
        }

        async function buy(name, price) {
            const { data: { user } } = await sb.auth.getUser();
            if(!user) return openModal('auth-modal');

            const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
            if(prof.balance < price) return alertMsg('Недостаточно средств!', '💸');

            const { data: acc } = await sb.from('accounts_data').select('*').eq('product_name', name).eq('is_sold', false).limit(1).single();
            if(!acc) return alertMsg('Товар закончился!', '⏳');

            await sb.from('profiles').update({ balance: prof.balance - price }).eq('id', user.id);
            await sb.from('accounts_data').update({ is_sold: true }).eq('id', acc.id);

            // ТУТ БУДЕТ ВЫДАЧА В БОТА
            const text = `УСПЕШНО 😉! Твой товар: ${acc.data}`;
            alertMsg(text, '🎉');
            
            // Отправка в ТГ (пример запроса)
            fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent('Покупка: ' + name + '\nДанные: ' + acc.data)}`);
            
            checkUser();
        }

        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                const { data: prof } = await sb.from('profiles').select('balance').eq('id', user.id).single();
                document.getElementById('user-info').innerHTML = `
                    <div class="text-right">
                        <div class="text-blue-500 font-black text-sm">${prof?.balance || 0} ₽</div>
                        <div class="text-[9px] opacity-40">${user.email}</div>
                    </div>
                `;
            }
        }

        loadProducts();
        checkUser();
    </script>
</body>
</html>
