<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS STORE | PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --card: #111111; --text: #ffffff; --accent: #2563eb; --border: rgba(255,255,255,0.1); }
        .light-mode { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --accent: #2563eb; --border: rgba(0,0,0,0.05); }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; margin: 0; }
        .boss-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; transition: 0.2s; }
        .boss-card:hover { border-color: var(--accent); }
        .drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 320px; height: 100%; background: var(--card); z-index: 1000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid var(--border); overflow-y: auto; }
        .drawer.active { right: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; z-index: 900; }
        .overlay.active { display: block; }
        .btn-blue { background: var(--accent); color: white; font-weight: 800; border-radius: 12px; }
        input { background: rgba(255,255,255,0.03); border: 1px solid var(--border); color: var(--text); outline: none; }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    </style>
</head>
<body>

    <div class="overlay" onclick="toggleDrawer()"></div>

    <!-- Шапка -->
    <nav class="sticky top-0 z-50 bg-inherit border-b border-white/5 p-4 flex justify-between items-center max-w-6xl mx-auto">
        <div class="text-xl font-black italic tracking-tighter text-blue-600">BOSS<span class="text-current">STORE</span></div>
        <div class="flex items-center gap-5">
            <button onclick="toggleTheme()" class="text-sm">🌓</button>
            <button onclick="toggleDrawer()" class="flex flex-col gap-1.5 items-end">
                <div class="w-6 h-0.5 bg-current"></div>
                <div class="w-6 h-0.5 bg-current"></div>
                <div class="w-4 h-0.5 bg-blue-600"></div>
                            </button>
        </div>
    </nav>

    <!-- Поиск и Заголовок -->
    <header class="p-4 max-w-6xl mx-auto mt-6">
        <h1 id="hero-title" class="text-4xl font-black uppercase italic mb-6 leading-none">EXCLUSIVE<br><span class="text-blue-600">ACCESS</span></h1>
        <div class="relative">
            <input type="text" id="search" oninput="doSearch()" placeholder="Поиск товара..." class="w-full p-4 rounded-2xl pl-12 text-sm">
            <span class="absolute left-4 top-4 opacity-30">🔍</span>
        </div>
    </header>

    <!-- Сетка товаров (Компактная) -->
    <main class="p-4 max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-3" id="products-grid"></main>

    <!-- МЕНЮ (DRAWER) -->
    <div class="drawer p-8" id="drawer">
        <div class="flex justify-between items-center mb-8">
            <span class="font-black uppercase tracking-widest text-xs">Navigation</span>
            <button onclick="toggleDrawer()" class="text-xl">✕</button>
        </div>

        <!-- Переключатели -->
        <div class="flex gap-4 mb-10 text-[10px] font-black uppercase tracking-tighter">
            <button onclick="switchSection('shop')" class="tab-btn active" id="btn-shop">Shop</button>
            <button onclick="switchSection('news')" class="tab-btn" id="btn-news">Articles</button>
            <button onclick="switchSection('reviews')" class="tab-btn" id="btn-reviews">Reviews</button>
        </div>

        <div id="auth-ui" class="space-y-4">
            <input id="email" type="email" placeholder="Email" class="w-full p-3 rounded-xl text-xs">
            <input id="pass" type="password" placeholder="Password" class="w-full p-3 rounded-xl text-xs">
            <button onclick="auth('login')" class="w-full btn-blue p-3 text-xs uppercase">Войти</button>
            <button onclick="auth('signup')" class="w-full border border-white/10 p-3 rounded-xl text-[10px] uppercase font-bold">Регистрация</button>
            <button onclick="resetPass()" class="w-full text-center opacity-30 text-[9px] uppercase font-bold">Забыли пароль?</button>
        </div>

        <div id="user-ui" class="hidden space-y-6">
            <div>
                                <p class="text-[9px] opacity-40 uppercase font-black mb-1">My Balance</p>
                <h3 class="text-3xl font-black text-blue-600" id="balance-val">0 ₽</h3>
            </div>
            <div class="flex flex-col gap-4 text-xs font-bold uppercase tracking-widest border-t border-white/5 pt-6">
                <button onclick="openModal('modal-voucher')">💰 Пополнить ваучером</button>
                <button onclick="setLang('ru')">🇷🇺 Русский язык</button>
                <button onclick="setLang('en')">🇺🇸 English</button>
                <button onclick="logout()" class="text-red-500 pt-10">Logout</button>
            </div>
        </div>
    </div>

    <!-- СЕКЦИИ: СТАТЬИ И ОТЗЫВЫ (ВЫЕЗЖАЮТ) -->
    <div id="news-section" class="fixed inset-0 bg-inherit z-[1100] hidden p-6 overflow-y-auto">
        <button onclick="closeSection('news-section')" class="mb-10 font-black text-blue-600">← BACK</button>
        <h2 class="text-3xl font-black mb-8 italic uppercase">News & Articles</h2>
        <div id="news-list" class="space-y-6"></div>
    </div>

    <div id="reviews-section" class="fixed inset-0 bg-inherit z-[1100] hidden p-6 overflow-y-auto">
        <button onclick="closeSection('reviews-section')" class="mb-10 font-black text-blue-600">← BACK</button>
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black italic uppercase">Reviews</h2>
            <button onclick="addReview()" class="text-[10px] btn-blue px-4 py-2">Add</button>
        </div>
        <div id="reviews-list" class="space-y-4"></div>
    </div>

    <!-- МОДАЛКИ -->
    <div id="boss-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center z-[2000] p-6">
        <div class="boss-card p-8 w-full max-w-xs text-center">
            <div id="m-icon" class="text-5xl mb-4">💡</div>
            <p id="m-text" class="text-sm font-bold mb-6 whitespace-pre-wrap"></p>
            <button onclick="closeModal('boss-modal')" class="w-full btn-blue p-4 text-xs uppercase italic">OK</button>
        </div>
    </div>

    <div id="modal-voucher" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-[2000] p-6">
        <div class="boss-card p-8 w-full max-w-xs">
            <input id="v-code" type="text" placeholder="Voucher Code" class="w-full p-4 rounded-xl text-center font-mono mb-4 italic">
            <button onclick="useVoucher()" class="w-full btn-blue p-4 text-xs uppercase italic">Activate</button>
            <button onclick="closeModal('modal-voucher')" class="w-full mt-2 opacity-30 text-[10px] uppercase font-bold">Close</button>
        </div>
    </div>

                            <span class="text-xs font-black italic">${p.price} ₽</span>

                    </div>
                    <button onclick="buy('${p.name}', ${p.price})" class="btn-blue w-full py-2.5 text-[10px] uppercase italic tracking-tighter">Get Access</button>
                </div>
            `).join('');

        }
