<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TG-MILLIONAIRE | Магазин Аккаунтов</title>
    <!-- Подключаем стили и базу данных -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #050505; color: white; }
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="font-sans min-h-screen">

    <!-- Шапка сайта -->
    <nav class="flex justify-between items-center p-6 max-w-6xl mx-auto">
        <div class="text-2xl font-black bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent uppercase tracking-tighter">
            TG-MILLIONAIRE
        </div>
        <div id="auth-section">
            <!-- Кнопка входа (динамическая) -->
            <button onclick="showAuthModal()" class="glass px-6 py-2 rounded-full font-bold hover:bg-white hover:text-black transition">
                ВОЙТИ
            </button>
        </div>
    </nav>

    <!-- Главный баннер -->
    <header class="text-center py-16 px-4">
        <h1 class="text-6xl md:text-8xl font-black mb-4 uppercase tracking-tighter neon-text">
            Магазин <span class="text-blue-500">будущего</span>
        </h1>
        <p class="text-gray-400 text-lg">Твой успех начинается с качественного аккаунта.</p>
    </header>

    <!-- Сетка товаров -->
    <section class="max-w-6xl mx-auto px-6 pb-20">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="products-list">
            <!-- Тут появится надпись при загрузке -->
            <p class="text-gray-500 text-center col-span-full">Загрузка товаров из базы...</p>
        </div>
    </section>

    <!-- Окно входа (Модалка) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center p-4 z-[100]">
        <div class="glass p-10 rounded-[40px] max-w-md w-full border-blue-500/20 shadow-2xl">
            <h2 class="text-3xl font-bold mb-6 text-center">Личный кабинет</h2>
                        <input id="auth-email" type="email" placeholder="Твой Email" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 text-white focus:border-blue-500 outline-none transition">
            <input id="auth-password" type="password" placeholder="Пароль (мин. 6 знаков)" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-6 text-white focus:border-blue-500 outline-none transition">
            
            <div class="flex flex-col gap-3">
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-2xl font-bold transition shadow-lg">ВОЙТИ</button>
                <button onclick="handleSignUp()" class="w-full border border-white/10 hover:bg-white/5 p-4 rounded-2xl font-bold transition">СОЗДАТЬ АККАУНТ</button>
            </div>
            
            <button onclick="closeAuthModal()" class="w-full mt-6 text-gray-500 hover:text-white transition text-sm">Закрыть окно</button>
        </div>
    </div>

    <!-- ЛОГИКА САЙТА -->
    <script>
        // --- НАСТРОЙКИ (ВСТАВЬ СВОИ ДАННЫЕ) ---
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co'; 
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C'; 
        // --------------------------------------

        const sb = supabase.createClient(SB_URL, SB_KEY);

        // Показ и скрытие модалки
        function showAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-modal').classList.add('flex');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('auth-modal').classList.remove('flex');
        }

        // Загрузка товаров
        async function loadProducts() {
            const list = document.getElementById('products-list');
            try {
                const { data, error } = await sb.from('products').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="text-gray-500 text-center col-span-full italic">Товаров в базе пока нет...</p>';
                    return;                }

                list.innerHTML = data.map(p => `
                    <div class="glass p-8 rounded-[40px] border border-white/5 hover:border-blue-500/50 transition-all group">
                        <div class="text-5xl mb-6 group-hover:scale-110 transition duration-300">📦</div>
                        <h3 class="text-2xl font-bold mb-2">${p.name}</h3>
                        <p class="text-gray-500 mb-6 text-sm font-medium leading-relaxed">${p.description || 'Высокое качество, мгновенная выдача.'}</p>
                        <div class="flex justify-between items-center mt-auto">
                            <span class="text-3xl font-black text-white">${p.price} ₽</span>
                            <button onclick="alert('Для покупки нужно пополнить баланс в кабинете!')" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-2xl font-bold shadow-lg transition">
                                КУПИТЬ
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                list.innerHTML = `<p class="text-red-500 text-center col-span-full text-sm">Ошибка базы: ${e.message}<br>Проверь RLS Policies в Supabase!</p>`;
            }
        }

        // Проверка входа
        async function checkUser() {
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                document.getElementById('auth-section').innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col items-end">
                            <span class="text-blue-400 font-black tracking-tighter">0.00 ₽</span>
                            <span class="text-[10px] text-gray-500 uppercase">${user.email}</span>
                        </div>
                        <button onclick="sb.auth.signOut().then(() => location.reload())" class="bg-white/5 p-2 rounded-xl hover:bg-red-500/20 transition">
                            🚪
                        </button>
                    </div>
                `;
            }
        }

        // Вход и Регистрация
        async function handleSignUp() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { error } = await sb.auth.signUp({ email, password });
            if (error) alert("Ошибка: " + error.message);
            else alert("Успех! Теперь нажми кнопку ВОЙТИ");
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) alert("Ошибка: " + error.message);
            else location.reload();
        }

        // Запуск
        loadProducts();
        checkUser();
    </script>
</body>
</html>
