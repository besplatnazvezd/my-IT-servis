<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВАМ ПОДАРОК! | BOSS STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .gift-box { transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .opened { transform: scale(0); opacity: 0; }
    </style>
</head>
<body>
    <div id="box-container" class="text-center cursor-pointer" onclick="openGift()">
        <div id="gift-icon" class="text-[150px] gift-box">🎁</div>
        <h1 class="text-2xl font-black mt-8 animate-pulse">ВАМ ПРИСЛАЛИ ПОДАРОК!<br>Нажми, чтобы открыть</h1>
    </div>

    <div id="content" class="hidden text-center p-6">
        <h2 class="text-blue-500 font-bold uppercase tracking-widest mb-4 text-xs font-black">Ваш эксклюзивный доступ:</h2>
        <div id="gift-data" class="bg-white/5 border border-white/10 p-10 rounded-[40px] text-3xl font-mono text-white break-all shadow-2xl shadow-blue-500/20"></div>
        <p class="mt-8 text-gray-500 text-[10px] uppercase font-bold tracking-widest italic">BOSS STORE | Благодарим за доверие</p>
    </div>

    <script>
        const SB_URL = 'ТВОЙ_URL'.trim();
        const SB_KEY = 'ТВОЙ_KEY'.trim();
        const sb = supabase.createClient(SB_URL, SB_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const giftId = urlParams.get('id');

        async function openGift() {
            const { data, error } = await sb.from('gifts').select('*').eq('id', giftId).single();
            if(error || !data) return alert("Подарок не найден или уже открыт!");

            document.getElementById('gift-icon').classList.add('opened');
            
            // Салют!
            var end = Date.now() + (3 * 1000);
            var colors = ['#3b82f6', '#ffffff'];
            (function frame() {
                confetti({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
                confetti({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            setTimeout(() => {
                document.getElementById('box-container').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                document.getElementById('gift-data').innerText = data.data;
            }, 600);
        }
    </script>
</body>
</html>
