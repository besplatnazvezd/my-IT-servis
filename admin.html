<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO PANEL | TG-MILLIONAIRE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050505; color: white; font-family: sans-serif; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input, textarea { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 15px; color: white; outline: none; width: 100%; margin-bottom: 10px; }
        input:focus { border-color: #2563eb; }
        button { transition: 0.2s; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body class="p-4 min-h-screen">

    <div class="max-w-2xl mx-auto pb-20">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-xl font-black text-blue-500 italic">CEO PANEL</h1>
            <a href="index.html" class="text-xs opacity-50 underline">На витрину</a>
        </div>

        <!-- 1. ТОВАРЫ -->
        <div class="glass p-6 rounded-[30px] mb-6">
            <h2 class="text-lg font-bold mb-4">📦 Новый товар</h2>
            <input id="p-name" type="text" placeholder="Имя (США 🇺🇸)">
            <input id="p-desc" type="text" placeholder="Описание">
            <input id="p-price" type="number" placeholder="Цена">
            <button onclick="addProduct()" class="w-full bg-blue-600 p-3 rounded-xl font-bold">ОПУБЛИКОВАТЬ</button>
        </div>

        <!-- 2. СТОК (АККАУНТЫ) -->
        <div class="glass p-6 rounded-[30px] mb-6 border-purple-500/20">
            <h2 class="text-lg font-bold mb-4">📥 Загрузить аккаунты</h2>
            <input id="stock-name" type="text" placeholder="Имя товара (США 🇺🇸)">
            <textarea id="stock-data" placeholder="логин:пароль (каждый с новой строки)" class="h-32 bg-white/5 border border-white/10 p-3 rounded-xl w-full text-white outline-none mb-2"></textarea>
            <button onclick="uploadStock()" class="w-full bg-purple-600 p-3 rounded-xl font-bold">ЗАГРУЗИТЬ В БАЗУ</button>
        </div>

        <!-- 3. ЮЗЕРЫ -->
        <div class="glass p-6 rounded-[30px]">
            <h2 class="text-lg font-bold mb-4">👥 Балансы клиентов</h2>
            <div id="users-list" class="space-y-3"></div>
                    </div>
    </div>

    <script>
        // КЛЮЧИ (ВСТАВЬ СВОИ)
        const URL = 'https://tivhinnaxagsazahtlnu.supabase.co'.trim();
        const KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C'.trim();
        const sb = supabase.createClient(URL, KEY);

        async function addProduct() {
            const name = document.getElementById('p-name').value;
            const description = document.getElementById('p-desc').value;
            const price = document.getElementById('p-price').value;
            const { error } = await sb.from('products').insert([{ name, description, price }]);
            if(error) alert(error.message); else { alert("Готово!"); location.reload(); }
        }

        async function uploadStock() {
            const name = document.getElementById('stock-name').value;
            const rawData = document.getElementById('stock-data').value.split('\n');
            const rows = rawData.filter(l => l.trim() !== '').map(l => ({
                product_name: name,
                data: l.trim(),
                is_sold: false
            }));
            const { error } = await sb.from('accounts_data').insert(rows);
            if(error) alert(error.message); else alert("Загружено: " + rows.length);
        }

        async function loadUsers() {
            const { data } = await sb.from('profiles').select('*');
            const list = document.getElementById('users-list');
            list.innerHTML = data.map(u => `
                <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl">
                    <div class="text-[10px] opacity-60 uppercase font-bold">${u.email}</div>
                    <div class="flex items-center gap-3">
                        <span class="font-black text-blue-400">${u.balance}₽</span>
                        <button onclick="updateBal('${u.id}', 100)" class="bg-green-500/20 text-green-500 px-2 py-1 rounded-lg text-[10px]">+100</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateBal(id, amt) {
            const { data: p } = await sb.from('profiles').select('balance').eq('id', id).single();
            await sb.from('profiles').update({ balance: (p.balance || 0) + amt }).eq('id', id);
            loadUsers();
        }

        loadUsers();
    </script>
</body>
</html>
