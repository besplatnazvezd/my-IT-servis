<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO PANEL | TG-MILLIONAIRE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; }
        input, textarea { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 15px; color: white; outline: none; width: 100%; margin-bottom: 10px; }
        button { transition: 0.2s; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body class="p-4 min-h-screen">

    <div class="max-w-2xl mx-auto pb-20">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-xl font-black text-blue-500 italic">CEO PANEL</h1>
            <a href="index.html" class="text-xs opacity-50 underline">На витрину</a>
        </div>

        <!-- 1. ТОВАРЫ -->
        <div class="card mb-6">
            <h2 class="text-lg font-bold mb-4">📦 Новый товар</h2>
            <input id="p-name" type="text" placeholder="Имя (США 🇺🇸)">
            <input id="p-desc" type="text" placeholder="Описание">
            <input id="p-price" type="number" placeholder="Цена">
            <button onclick="addProduct()" class="w-full bg-blue-600 p-3 rounded-xl font-bold">ОПУБЛИКОВАТЬ</button>
        </div>

        <!-- 2. СТОК (АККАУНТЫ) -->
        <div class="card mb-6">
            <h2 class="text-lg font-bold mb-4">📥 Загрузить аккаунты</h2>
            <input id="stock-name" type="text" placeholder="Имя товара (США 🇺🇸)">
            <textarea id="stock-data" placeholder="логин:пароль (каждый с новой строки)"></textarea>
            <button onclick="uploadStock()" class="w-full bg-purple-600 p-3 rounded-xl font-bold">ЗАГРУЗИТЬ В БАЗУ</button>
        </div>

        <!-- 3. ВАУЧЕРЫ -->
        <div class="card mb-6">
            <h2 class="text-lg font-bold mb-4">🎁 Создать ваучер</h2>
            <input id="voucher-code" type="text" placeholder="Код (например: FREE100)">
            <input id="voucher-value" type="number" placeholder="Сумма (например: 100)">
                        <button onclick="createVoucher()" class="w-full bg-pink-600 p-3 rounded-xl font-bold">СОЗДАТЬ ВАУЧЕР</button>
        </div>

        <!-- 4. ЮЗЕРЫ -->
        <div class="card">
            <h2 class="text-lg font-bold mb-4">👥 Балансы клиентов</h2>
            <div id="users-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        // КЛЮЧИ (ВСТАВЬ СВОИ)
        const SB_URL = 'https://tivhinnaxagsazahtlnu.supabase.co'.trim();
        const SB_KEY = 'sb_publishable_yWML4Fb7nK4EKAneHKaQMA_1YJQzu1C'.trim();
        const ADMIN_PASSWORD = 'derty456765@'; // <- Придумай сложный пароль!
        const sb = supabase.createClient(SB_URL, SB_KEY);

        // Проверка админа
        async function checkAdmin() {
            const adminPass = prompt('Хм, жду пароль:');
            if (adminPass !== ADMIN_PASSWORD) {
                alert('Неверный пароль!');
                window.location.href = 'index.html'; // Перенаправить на главную
            }
        }

        async function addProduct() {
            const name = document.getElementById('p-name').value;
            const description = document.getElementById('p-desc').value;
            const price = document.getElementById('p-price').value;
            if (!name || !price) return alert("Заполни имя и цену!");
            const { error } = await sb.from('products').insert([{ name, description, price }]);
            if(error) alert(error.message); else { alert("Готово!"); location.reload(); }
        }

        async function uploadStock() {
            const name = document.getElementById('stock-name').value;
            const rawData = document.getElementById('stock-data').value.split('n');
            const rows = rawData.filter(l => l.trim() !== '').map(l => ({
                product_name: name,
                data: l.trim(),
                is_sold: false
            }));
            const { error } = await sb.from('accounts_data').insert(rows);
            if(error) alert(error.message); else alert("Загружено: " + rows.length);
        }

        async function createVoucher() {
            const code = document.getElementById('voucher-code').value;
            const value = document.getElementById('voucher-value').value;
            if (!code || !value) return alert("Заполни код и сумму!");
            const { error } = await sb.from('vouchers').insert([{ code, value, is_used: false }]);
            if(error) alert(error.message); else alert("Ваучер создан!");
        }

        async function loadUsers() {
            const { data } = await sb.from('profiles').select('*');
            const list = document.getElementById('users-list');
            list.innerHTML = data.map(u => 
                <div class="flex items-center justify-between bg-white/5 p-4 rounded-2xl">
                    <div class="text-xs">
                        <div class="font-bold text-gray-300">${u.email}</div>
                        <div class="text-blue-400 font-black text-lg">${u.balance} ₽</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="updateBal('${u.id}', 100)" class="bg-green-500/20 text-green-500 px-2 py-1 rounded-lg text-[10px] font-bold">+100</button>
                        <button onclick="updateBal('${u.id}', -100)" class="bg-red-500/20 text-red-500 px-2 py-1 rounded-lg text-[10px] font-bold">-100</button>
                    </div>
                </div>
            ).join('');
        }

        async function updateBal(id, amt) {
            const { data: p } = await sb.from('profiles').select('balance').eq('id', id).single();
            await sb.from('profiles').update({ balance: (p.balance || 0) + amt }).eq('id', id);
            loadUsers();
        }

        checkAdmin(); // Запускаем проверку при загрузке
        loadUsers();
    </script>
</body>
</html>

            loadUsers();
        }

        checkAdmin(); // Запускаем проверку при загрузке
        loadUsers();
    </script>
</body>
</html>
